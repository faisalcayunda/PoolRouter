# Override produksi (ADR-0001 Addendum A §3.1, §4, §5). Image berdasarkan digest.
# Tidak ada build, tidak ada service mock-dukcapil (dijaga compose-lint, V1).
# Bundled atau managed ditentukan lewat COMPOSE_PROFILES eksplisit (Makefile). Tiga service infra
# di sini hanya berlaku jika profile bundled-infra dipilih, dengan restart dan limit yang sama dengan staging.
x-hardened-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  migrate:
    environment:
      POOLROUTER_DB_SSLMODE: ${POOLROUTER_DB_SSLMODE:?isi POOLROUTER_DB_SSLMODE di file env}

  postgres:
    restart: unless-stopped
    logging: *logging
    # Sertifikat TLS server sungguhan (ssl = on). Tanpa ini start gagal, bukan self-signed diam-diam.
    secrets: [pg_server_crt, pg_server_key]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1g}

  redis:
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512m}

  rabbitmq:
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1g}

  backend-webserver:
    restart: unless-stopped
    logging: *logging
    environment:
      POOLROUTER_DB_SSLMODE: ${POOLROUTER_DB_SSLMODE:?isi POOLROUTER_DB_SSLMODE di file env}
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512m}

  backend-controller:
    restart: unless-stopped
    logging: *logging
    environment:
      POOLROUTER_DB_SSLMODE: ${POOLROUTER_DB_SSLMODE:?isi POOLROUTER_DB_SSLMODE di file env}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256m}

  backend-worker:
    restart: unless-stopped
    logging: *logging
    environment:
      POOLROUTER_DB_SSLMODE: ${POOLROUTER_DB_SSLMODE:?isi POOLROUTER_DB_SSLMODE di file env}
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512m}

  frontend:
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256m}

# Sertifikat TLS server PostgreSQL (SHAA-381, Ridley review). Isi berkas dari PKI yang disetujui; tidak di repo.
secrets:
  pg_server_crt:
    file: ${POOLROUTER_SECRETS_DIR:?isi POOLROUTER_SECRETS_DIR di file env}/pg_server_crt
  pg_server_key:
    file: ${POOLROUTER_SECRETS_DIR:?isi POOLROUTER_SECRETS_DIR di file env}/pg_server_key
