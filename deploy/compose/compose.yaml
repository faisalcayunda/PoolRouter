# Definisi dasar PoolRouter (ADR-0001 Addendum A §3.1, §4, §5, §6).
# Dipakai bersama override per lingkungan: compose.dev.yaml, compose.staging.yaml,
# compose.prod.yaml. Jalankan lewat `make compose-up ENV=<dev|staging|prod>`.
# Tidak memakai fitur khusus satu engine (§5). Image pihak ketiga di-pin tag dan digest.
# Kontrak variabel dan pemetaan role: kontrak-env-backend-poolrouter-v1 (§2, §3).
#
# Secret tidak pernah ada di `environment:`. Hanya path `/run/secrets/<nama>` yang ditulis di sini.
# Entrypoint image pihak ketiga yang tidak mendukung *_FILE membaca secret lalu mengekspornya
# di shell (pola tetap, KD-1). Nilai secret tidak masuk argv: config Redis lewat file tmpfs,
# password RabbitMQ lewat variabel environment proses.

x-backend-env: &backend-env
  POOLROUTER_ENV: ${POOLROUTER_ENV:?isi POOLROUTER_ENV di file env}
  POOLROUTER_DB_HOST: ${POOLROUTER_DB_HOST:-postgres}
  POOLROUTER_DB_PORT: ${POOLROUTER_DB_PORT:-5432}
  POOLROUTER_DB_NAME: ${POSTGRES_DB:?isi POSTGRES_DB di file env}
  POOLROUTER_REDIS_HOST: ${POOLROUTER_REDIS_HOST:-redis}
  POOLROUTER_REDIS_PORT: ${POOLROUTER_REDIS_PORT:-6379}
  POOLROUTER_REDIS_PASSWORD_FILE: /run/secrets/redis_password
  POOLROUTER_RABBITMQ_HOST: ${POOLROUTER_RABBITMQ_HOST:-rabbitmq}
  POOLROUTER_RABBITMQ_PORT: ${POOLROUTER_RABBITMQ_PORT:-5672}
  POOLROUTER_RABBITMQ_VHOST: ${POOLROUTER_RABBITMQ_VHOST:-/}
  POOLROUTER_RABBITMQ_USER: ${RABBITMQ_USER:?isi RABBITMQ_USER di file env}
  POOLROUTER_RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password

services:
  postgres:
    # Image PostgreSQL 17 + pgBackRest (ADR-0005 §4.5, SHAA-381). Dibangun dari deploy/compose/backup/Containerfile.
    # Dev membangunnya lokal (compose.dev.yaml); staging dan prod memakai image yang sudah berdigest.
    image: ${POOLROUTER_POSTGRES_IMAGE:?isi POOLROUTER_POSTGRES_IMAGE di file env}
    profiles: ["bundled-infra"]
    # Image berjalan sebagai 10001:10001 (Containerfile). Tanpa cap tambahan dan tanpa root.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?isi POSTGRES_DB di file env}
      POSTGRES_USER: ${POSTGRES_USER:?isi POSTGRES_USER di file env}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # pgBackRest (ADR-0005 §4.5). Passphrase repo lewat secret pgbackrest_repo1_cipher_pass, bukan di sini.
      PGBACKREST_STANZA: ${PGBACKREST_STANZA:-poolrouter}
      PGBACKREST_PG1_PATH: /var/lib/postgresql/data
      PGBACKREST_PG1_USER: ${POSTGRES_USER:?isi POSTGRES_USER di file env}
      PGBACKREST_PG1_SOCKET_PATH: /var/run/postgresql
      PGBACKREST_REPO1_TYPE: ${PGBACKREST_REPO1_TYPE:-posix}
      PGBACKREST_REPO1_PATH: /var/lib/pgbackrest
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_RETENTION_FULL_TYPE: time
      PGBACKREST_REPO1_RETENTION_FULL: ${PGBACKREST_REPO1_RETENTION_FULL:-7}
      PGBACKREST_COMPRESS_TYPE: zst
      PGBACKREST_ARCHIVE_ASYNC: "y"
      PGBACKREST_SPOOL_PATH: /var/spool/pgbackrest
      PGBACKREST_LOG_PATH: /var/log/pgbackrest
      PR_BACKUP_FULL_HOUR_UTC: ${PR_BACKUP_FULL_HOUR_UTC:-18}
      PR_BACKUP_DIFF_EVERY_HOURS: ${PR_BACKUP_DIFF_EVERY_HOURS:-6}
      PR_BACKUP_VERIFY_HOUR_UTC: ${PR_BACKUP_VERIFY_HOUR_UTC:-19}
      PR_BACKUP_FULL_WEEKDAY: ${PR_BACKUP_FULL_WEEKDAY:-daily}
      # Kosong = bawaan pgBackRest. Jadwal hemat (ADR-0005 §5.2) mengisi 8. Diteruskan ke
      # PGBACKREST_REPO1_RETENTION_DIFF oleh pr-pg-entrypoint.sh hanya bila terisi.
      PR_REPO1_RETENTION_DIFF: ${PR_REPO1_RETENTION_DIFF:-}
    # Konfigurasi server lewat flag, bukan postgresql.conf, agar terlihat di satu tempat. archive_command
    # memakai stanza dari PGBACKREST_STANZA. Sertifikat TLS dibuat pr-pg-entrypoint.sh bila belum ada.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest archive-push %p
      - -c
      - archive_timeout=60
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
    secrets: [db_password, pgbackrest_repo1_cipher_pass]
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Repo pgBackRest di volume terpisah dari volume data DB (ADR-0005 §4.5).
      - pg_backup_repo:/var/lib/pgbackrest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: docker.io/library/redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    profiles: ["bundled-infra"]
    # Password ditulis ke config di tmpfs (bukan argv), lalu entrypoint resmi menjalankan redis-server
    # sebagai user redis. Kalau secret kosong, start gagal (exit non-zero).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        pw=$$(cat /run/secrets/redis_password)
        [ -n "$$pw" ] || { echo "redis_password kosong" >&2; exit 1; }
        umask 077
        printf 'requirepass "%s"\nappendonly yes\n' "$$pw" > /tmp/redis.conf
        chmod 0644 /tmp/redis.conf
        exec docker-entrypoint.sh redis-server /tmp/redis.conf
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    secrets: [redis_password]
    volumes:
      - redis_data:/data
    healthcheck:
      # REDISCLI_AUTH lewat environment proses redis-cli, bukan argumen -a.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  rabbitmq:
    image: docker.io/library/rabbitmq:4-management-alpine@sha256:b768d2e09a809b48458d6c3c32fc2894643a6bfafd76264c120373eff0ee6532
    profiles: ["bundled-infra"]
    # RabbitMQ 4 menolak *_FILE (RABBITMQ_DEFAULT_PASS_FILE). Password dibaca dari secret
    # saat start lalu diekspor ke proses (pola tetap, KD-1). Secret kosong membuat start gagal.
    # Berjalan sebagai user image (100:101) tanpa root, tanpa cap tambahan.
    user: "100:101"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        p=$$(cat /run/secrets/rabbitmq_password)
        [ -n "$$p" ] || { echo "rabbitmq_password kosong" >&2; exit 1; }
        export RABBITMQ_DEFAULT_PASS="$$p"
        exec docker-entrypoint.sh rabbitmq-server
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?isi RABBITMQ_USER di file env}
    secrets: [rabbitmq_password]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 30s

  migrate:
    image: ${POOLROUTER_BACKEND_IMAGE:?isi POOLROUTER_BACKEND_IMAGE di file env}
    profiles: ["migrate"]
    command: ["migrate"]
    environment:
      POOLROUTER_ENV: ${POOLROUTER_ENV:?isi POOLROUTER_ENV di file env}
      POOLROUTER_DB_HOST: ${POOLROUTER_DB_HOST:-postgres}
      POOLROUTER_DB_PORT: ${POOLROUTER_DB_PORT:-5432}
      POOLROUTER_DB_NAME: ${POSTGRES_DB:?isi POSTGRES_DB di file env}
      # Satu-satunya service yang menerima secret poolrouter_owner (ADR-0001 §7.2, lint V1).
      POOLROUTER_DB_OWNER_PASSWORD_FILE: /run/secrets/poolrouter_owner
    secrets: [poolrouter_owner]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Satu role database per komponen (ADR-0001 rev 11 §7.2, kontrak §3).
  backend-webserver:
    image: ${POOLROUTER_BACKEND_IMAGE:?isi POOLROUTER_BACKEND_IMAGE di file env}
    profiles: ["app"]
    command: ["webserver"]
    environment:
      <<: *backend-env
      POOLROUTER_DB_API_PASSWORD_FILE: /run/secrets/pr_api
      POOLROUTER_DB_ADMIN_API_PASSWORD_FILE: /run/secrets/pr_admin_api
      POOLROUTER_TOKEN_ISSUER: ${POOLROUTER_TOKEN_ISSUER:?isi POOLROUTER_TOKEN_ISSUER di file env}
      POOLROUTER_UI_ORIGIN: ${POOLROUTER_UI_ORIGIN:?isi POOLROUTER_UI_ORIGIN di file env}
      POOLROUTER_KEK_FILE: /run/secrets/poolrouter_kek
      POOLROUTER_JWT_SIGNING_KEY_FILE: /run/secrets/poolrouter_jwt_signing_key
      POOLROUTER_NIK_HMAC_KEY_FILE: /run/secrets/poolrouter_nik_hmac_key
      POOLROUTER_IDEMPOTENCY_HMAC_KEY_FILE: /run/secrets/poolrouter_idempotency_hmac_key
    secrets:
      - pr_api
      - pr_admin_api
      - redis_password
      - rabbitmq_password
      - poolrouter_kek
      - poolrouter_jwt_signing_key
      - poolrouter_nik_hmac_key
      - poolrouter_idempotency_hmac_key
    # Healthcheck lewat subcommand binary `webserver` (ADR-0001 rev 15 §2 dan §5a.9, keputusan Shu SHAA-191). Image belum ada
    # sampai Bagian 2; subcommand `healthcheck` menunggu SHAA-175.
    healthcheck:
      test: ["CMD", "webserver", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  backend-controller:
    image: ${POOLROUTER_BACKEND_IMAGE:?isi POOLROUTER_BACKEND_IMAGE di file env}
    profiles: ["app"]
    command: ["controller"]
    environment:
      <<: *backend-env
      POOLROUTER_DB_CONTROLLER_PASSWORD_FILE: /run/secrets/pr_controller
      POOLROUTER_DB_WEBHOOK_PASSWORD_FILE: /run/secrets/pr_webhook
      POOLROUTER_KEK_FILE: /run/secrets/poolrouter_kek
    secrets: [pr_controller, pr_webhook, redis_password, rabbitmq_password, poolrouter_kek]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  backend-worker:
    image: ${POOLROUTER_BACKEND_IMAGE:?isi POOLROUTER_BACKEND_IMAGE di file env}
    profiles: ["app"]
    command: ["worker"]
    environment:
      <<: *backend-env
      POOLROUTER_DB_WORKER_PASSWORD_FILE: /run/secrets/pr_worker
      POOLROUTER_KEK_FILE: /run/secrets/poolrouter_kek
    secrets: [pr_worker, redis_password, rabbitmq_password, poolrouter_kek]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  frontend:
    image: ${POOLROUTER_FRONTEND_IMAGE:?isi POOLROUTER_FRONTEND_IMAGE di file env}
    profiles: ["app"]
    ports:
      - "${POOLROUTER_BIND_ADDR:-127.0.0.1}:${POOLROUTER_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  pg_data: {}
  pg_backup_repo: {}
  redis_data: {}
  rabbitmq_data: {}

secrets:
  db_password:
    file: ${POOLROUTER_SECRETS_DIR:?isi POOLROUTER_SECRETS_DIR di file env}/db_password
  pgbackrest_repo1_cipher_pass:
    file: ${POOLROUTER_SECRETS_DIR:?}/pgbackrest_repo1_cipher_pass
  redis_password:
    file: ${POOLROUTER_SECRETS_DIR:?}/redis_password
  rabbitmq_password:
    file: ${POOLROUTER_SECRETS_DIR:?}/rabbitmq_password
  poolrouter_owner:
    file: ${POOLROUTER_SECRETS_DIR:?}/poolrouter_owner
  pr_api:
    file: ${POOLROUTER_SECRETS_DIR:?}/pr_api
  pr_admin_api:
    file: ${POOLROUTER_SECRETS_DIR:?}/pr_admin_api
  pr_controller:
    file: ${POOLROUTER_SECRETS_DIR:?}/pr_controller
  pr_webhook:
    file: ${POOLROUTER_SECRETS_DIR:?}/pr_webhook
  pr_worker:
    file: ${POOLROUTER_SECRETS_DIR:?}/pr_worker
  poolrouter_kek:
    file: ${POOLROUTER_SECRETS_DIR:?}/poolrouter_kek
  poolrouter_jwt_signing_key:
    file: ${POOLROUTER_SECRETS_DIR:?}/poolrouter_jwt_signing_key
  poolrouter_nik_hmac_key:
    file: ${POOLROUTER_SECRETS_DIR:?}/poolrouter_nik_hmac_key
  poolrouter_idempotency_hmac_key:
    file: ${POOLROUTER_SECRETS_DIR:?}/poolrouter_idempotency_hmac_key
