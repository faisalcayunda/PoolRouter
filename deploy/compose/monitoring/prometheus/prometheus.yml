# Prometheus dev (SHAA-334, ADR-0006 D5). Internal saja: tidak ada port host.
# Target scrape: webserver, controller, worker. Port metrik aplikasi belum ditetapkan
# (belum ada endpoint /metrics di backend); target akan DOWN sampai ada. Lihat runbook.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: poolrouter-webserver
    metrics_path: /metrics
    static_configs:
      - targets: ["backend-webserver:9100"]
  - job_name: poolrouter-controller
    metrics_path: /metrics
    static_configs:
      - targets: ["backend-controller:9100"]
  - job_name: poolrouter-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["backend-worker:9100"]
