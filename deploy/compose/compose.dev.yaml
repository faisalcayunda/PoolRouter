# Override dev (ADR-0001 Addendum A §3.1, §4). Build dari source lewat `make image`;
# blok `build:` hanya mencatat konteks dan nama image. Seed dan mock hanya di dev.
# sslmode `disable` hanya di sini (kontrak env §2).
services:
  migrate:
    environment:
      POOLROUTER_DB_SSLMODE: disable

  backend-webserver:
    build:
      context: ../../backend
      dockerfile: Containerfile
      args:
        # Eksplisit: VM Podman lokal 2 CPU / 3,7 GiB (SHAA-222). Default Containerfile (2) tidak dipakai di sini.
        JOBS: "1"
    environment:
      POOLROUTER_DB_SSLMODE: disable
      POOLROUTER_SEED_SYNTHETIC: "true"
      POOLROUTER_SEED_PASSWORD_FILE: /run/secrets/poolrouter_seed_password
    secrets: [poolrouter_seed_password]

  backend-controller:
    environment:
      POOLROUTER_DB_SSLMODE: disable

  backend-worker:
    environment:
      POOLROUTER_DB_SSLMODE: disable

  mock-dukcapil:
    image: ${POOLROUTER_MOCK_DUKCAPIL_IMAGE:?isi POOLROUTER_MOCK_DUKCAPIL_IMAGE di file env}
    profiles: ["mock"]
    ports:
      - "127.0.0.1:${POOLROUTER_MOCK_PORT:-18080}:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Object storage arsip (ADR-0006 D6), profile objstore. Image di-pin tag dan digest.
  # Kredensial lewat *_FILE (RUSTFS_ACCESS_KEY_FILE, RUSTFS_SECRET_KEY_FILE), bukan environment.
  object-storage:
    image: docker.io/rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    profiles: ["objstore"]
    environment:
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/objstore_root_user
      RUSTFS_SECRET_KEY_FILE: /run/secrets/objstore_root_password
      RUSTFS_VOLUMES: /data
    secrets: [objstore_root_user, objstore_root_password]
    volumes:
      - objstore_data:/data
    read_only: true
    tmpfs: [/tmp, /logs]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  # Satu kali: membuat bucket arsip dengan object lock dan versioning. Idempoten.
  objstore-init:
    image: docker.io/amazon/aws-cli@sha256:d557b3524475d70dd3104cf44d96568ee3188897b73a6ece2b37aa50e1af362f
    profiles: ["objstore"]
    depends_on:
      object-storage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export AWS_ACCESS_KEY_ID="$$(cat /run/secrets/objstore_root_user)"
        export AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/objstore_root_password)"
        export AWS_DEFAULT_REGION=us-east-1
        EP=http://object-storage:9000
        B="$${POOLROUTER_ARSIP_BUCKET:-poolrouter-arsip-dev}"
        if aws --endpoint-url "$$EP" s3api head-bucket --bucket "$$B" >/dev/null 2>&1; then
          echo "bucket $$B sudah ada"
        else
          aws --endpoint-url "$$EP" s3api create-bucket --bucket "$$B" --object-lock-enabled-for-bucket
        fi
        aws --endpoint-url "$$EP" s3api put-bucket-versioning --bucket "$$B" --versioning-configuration Status=Enabled
        aws --endpoint-url "$$EP" s3api put-object-lock-configuration --bucket "$$B" \
          --object-lock-configuration "{\"ObjectLockEnabled\":\"Enabled\",\"Rule\":{\"DefaultRetention\":{\"Mode\":\"GOVERNANCE\",\"Days\":$${POOLROUTER_ARSIP_RETENSI_HARI:-1}}}}"
    environment:
      POOLROUTER_ARSIP_BUCKET: ${POOLROUTER_ARSIP_BUCKET:-poolrouter-arsip-dev}
      POOLROUTER_ARSIP_RETENSI_HARI: ${POOLROUTER_ARSIP_RETENSI_HARI:-1}
    secrets: [objstore_root_user, objstore_root_password]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  # Monitoring internal (ADR-0006 D5), profile monitoring. Tanpa port host.
  prometheus:
    image: docker.io/prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prom_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  alertmanager:
    image: docker.io/prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - am_data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  objstore_data: {}
  prom_data: {}
  am_data: {}

# Secret hanya dev (kontrak §2, POOLROUTER_SEED_PASSWORD_FILE).
secrets:
  poolrouter_seed_password:
    file: ${POOLROUTER_SECRETS_DIR:?isi POOLROUTER_SECRETS_DIR di file env}/poolrouter_seed_password
  objstore_root_user:
    file: ${POOLROUTER_SECRETS_DIR:?isi POOLROUTER_SECRETS_DIR di file env}/objstore_root_user
  objstore_root_password:
    file: ${POOLROUTER_SECRETS_DIR:?isi POOLROUTER_SECRETS_DIR di file env}/objstore_root_password
