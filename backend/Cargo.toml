[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/webserver",
    "crates/controller",
    "crates/worker",
    "crates/queue-apalis",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false
repository = "https://github.com/faisalcayunda/PoolRouter"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# ADR-0004 rev 4 section 4 (F0 crates). Versions are lower bounds (caret).
# F2 crates (tonic, prost, wasmtime) are intentionally absent (K-31).
[workspace.dependencies]
# 4.1 Core service
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "signal", "net"] }
tokio-util = "0.7.20"
axum = { version = "0.8.9", features = ["json", "macros"] }
tower = { version = "0.5.3", features = ["timeout", "limit"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "request-id", "limit", "sensitive-headers", "set-header"] }
utoipa = { version = "6.0", features = ["axum_extras", "uuid", "chrono", "yaml"] }
utoipa-axum = "0.3"
# Dev-only: membaca `openapi/*.yaml` hasil generate di test. Sudah masuk lock
# lewat utoipa, jadi tidak menambah crate baru.
yaml_serde = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# `application/x-www-form-urlencoded` in the token endpoint (SHAA-198).
serde_urlencoded = "0.7"
regex = "1.13"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
uuid = { version = "1.29", features = ["v7", "serde"] }
axum-extra = { version = "0.12.6", default-features = false, features = ["cookie"] }
thiserror = "2.0"
anyhow = "1.0"

# 4.2 Data, Redis, outbound HTTP
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "macros", "migrate", "uuid", "chrono", "json"] }
redis = { version = "1.8", features = ["tokio-rustls-comp", "connection-manager", "script", "aio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-pki-types = "1.15"
# Archive format and object storage (ADR-0006 section 8 butir 3, ADR-0004 section 4.2).
# `encryption` is deliberately off: DA10 seals `nik` and payload cells in the
# application, so the column layout does not depend on the Parquet modular
# encryption version the pinned `parquet` supports.
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "async", "zstd", "snap", "brotli", "lz4", "flate2-zlib-rs", "simdutf8"] }
# No `prettyprint`: the archive module reads and writes columns only and never
# prints a table, so the feature would only widen the graph.
arrow = { version = "60.1.0", default-features = false }
object_store = { version = "0.14.2", features = ["aws"] }
bytes = "1.12"
futures = "0.3"

# 4.3 Queue (adapter queue-apalis only)
apalis = { version = "1.0.0", default-features = false, features = ["tracing"] }
apalis-amqp = "=1.0.0"
lapin = { version = "4.12", default-features = false, features = ["tokio"] }

# 4.4 Crypto and secrets
aws-lc-rs = "1.19"
argon2 = { version = "0.6", features = ["password-hash", "zeroize"] }
jsonwebtoken = { version = "11.1", features = ["aws_lc_rs", "use_pem"] }
secrecy = { version = "0.10.3", features = ["serde"] }
zeroize = { version = "1.9", features = ["derive"] }
# Pinned to the versions already in Cargo.lock (base64 has 0.22 and 0.23 in the
# tree), so declaring them adds no new package. Both are needed by the admin
# primitives: base64 for the opaque session token's text form, subtle for the
# constant-time comparisons that keep verify/lookup free of timing leaks.
base64 = "=0.22.1"
subtle = "=2.6.1"
# Already in the lock at 0.4.3 (argon2 -> password-hash). Used to mint session
# tokens from the OS CSPRNG.
getrandom = "=0.4.3"
# Already in the lock at 0.10.9; used for the SHA-256 of a session token.
sha2 = "=0.10.9"

# 4.5 Observability (the four OpenTelemetry crates move in lockstep)
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter", "fmt"] }
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["http-proto"] }
tracing-opentelemetry = "0.34"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", features = ["http-listener"] }

# 4.6 Test (dev-dependencies)
proptest = "1.12"
wiremock = "0.6.5"

# Internal crates
poolrouter-core = { path = "crates/core" }
poolrouter-queue-apalis = { path = "crates/queue-apalis" }
