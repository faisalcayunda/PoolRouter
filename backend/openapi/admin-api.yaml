      - sessionCookie: []
    delete:
      tags:
      - admin
      summary: Remove an allowlist entry (PA).
      operationId: deleteWebhookAllowlistEntry
      parameters:
      - name: domain
        in: path
        description: Domain
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Entri dihapus
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
          $ref: '#/components/responses/Problem403Admin'
      security:
      - sessionCookie: []
components:
  schemas:
    AlasanK20:
      type: object
      description: Reason body for deactivate/revoke (K-20).
      required:
      - alasan
      properties:
        alasan:
          type: string
          example: Kontrak client berakhir.
          maxLength: 500
          minLength: 10
      additionalProperties: false
    AllowlistEntry:
      type: object
      description: One allowlist entry (US-06).
      required:
      - domain
      - aktif
      properties:
        aktif:
          type: boolean
        domain:
          type: string
          example: mpm.example.go.id
    AllowlistPut:
      type: object
      description: '`putWebhookAllowlistEntry` body.'
      required:
      - aktif
      properties:
        aktif:
          type: boolean
      additionalProperties: false
    AuditAksesBaris:
      type: object
      description: One `audit_akses` row (no `nik_hmac`).
      required:
      - audit_id
      - dilakukan_pada
      - pengguna_id
      - aksi
      - hasil
      properties:
        aksi:
          type: string
          example: lihat_payload
        alasan:
          type:
          - string
          - 'null'
        audit_id:
          type: string
          format: uuid
        dilakukan_pada:
          type: string
          format: date-time
        hasil:
          type: string
          description: '`berhasil` | `ditolak`.'
        pengguna_id:
          type: string
          format: uuid
    AuditAksesPage:
      type: object
      description: Paginated audit akses result.
      required:
      - baris
      properties:
        baris:
          type: array
          items:
            $ref: '#/components/schemas/AuditAksesBaris'
        kursor:
          type:
          - string
          - 'null'
    AuditCariRequest:
      type: object
      description: |-
        `searchAuditAkses` body (auditor only; range max 31 days). Rows carry no
        `nik_hmac`.
      required:
      - dari
      - sampai
      properties:
        aksi:
          type:
          - string
          - 'null'
          description: Action filter (`login`, `cari_log`, `lihat_payload`, ...).
        dari:
          type: string
          format: date-time
        hasil:
          type:
          - string
          - 'null'
          description: '`berhasil` | `ditolak`.'
        kursor:
          type:
          - string
          - 'null'
        pengguna_id:
          type:
          - string
          - 'null'
          format: uuid
        sampai:
          type: string
          format: date-time
      additionalProperties: false
    BahasaUi:
      type: string
      description: Interface language (ADR-0003 Addendum A).
      enum:
      - id
      - en
    Client:
      type: object
      description: Client entity.
      required:
      - client_id
      - nama
      - limiter_penolakan_burst
      - limiter_penolakan_isi_ulang_per_detik
      - aktif
      properties:
        aktif:
          type: boolean
        client_id:
          type: string
          format: uuid
        limiter_penolakan_burst:
          type: integer
          format: int64
        limiter_penolakan_isi_ulang_per_detik:
          type: number
          format: double
        nama:
          type: string
          example: BGN MPM Production
    ClientConfig:
      type: object
      description: Client configuration body (US-02; L-04 limiter ranges).
      required:
      - nama
      properties:
        alasan:
          type:
          - string
          - 'null'
          description: Reason; required when changing the limiter.
          maxLength: 500
          minLength: 10
        limiter_penolakan_burst:
          type:
          - integer
          - 'null'
          format: int64
          description: 1..=1000, default 20 (L-04).
          example: 20
          maximum: 1000
          minimum: 1
        limiter_penolakan_isi_ulang_per_detik:
          type:
          - number
          - 'null'
          format: double
          description: 0.10..=100.00 per second, default 1.00 (L-04).
          example: 1.0
          maximum: 100
          minimum: 0.1
        nama:
          type: string
          example: BGN MPM Production
      additionalProperties: false
    ClientEndpoints:
      type: object
      description: '`setClientEndpoints` body (U-7 shape).'
      required:
      - endpoint_ids
      properties:
        endpoint_ids:
          type: array
          items:
            type: string
            format: uuid
          description: |-
            Complete assignment; replaces the previous set. An empty set revokes
            every assignment, so the client then receives 404 from every endpoint.
          minItems: 0
      additionalProperties: false
    Credential:
      type: object
      description: Credential entity (list response; no hash is ever returned).
      required:
      - credential_id
      - jenis
      - status
      properties:
        credential_id:
          type: string
          format: uuid
        dicabut_at:
          type:
          - string
          - 'null'
          format: date-time
        jenis:
          $ref: '#/components/schemas/JenisKredensial'
        kedaluwarsa_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          $ref: '#/components/schemas/StatusKredensial'
    CredentialCreate:
      type: object
      description: |-
        `createCredential` body (contract section 3.1b). Default and maximum
        expiry 365 days.
      required:
      - jenis
      properties:
        jenis:
          $ref: '#/components/schemas/JenisKredensial'
        kedaluwarsa_at:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
    CredentialSecret:
      type: object
      description: Secret response; returned exactly once, `no-store`.
      required:
      - credential_id
      - client_id
      - secret
      properties:
        client_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
        kedaluwarsa_at:
          type:
          - string
          - 'null'
          format: date-time
        secret:
          type: string
          description: |-
            Client secret: 256-bit base64url. API key: the full string
            `pr_<credential_id 32 hex>_<secret 256-bit base64url>` (ADR-0001 5a.5,
            SHAA-198 U-13). Never returned again (contract 3.1b).
          example: pr_0193b8a27c4e7d108a3f5e6b7c8d9e0f_2fJ8N0qk0e6h7h0F1D2J3k4L5m6N7o8P9Q0r1S2t3U4
    DaftarMfaRequest:
      type: object
      description: 'Body of `POST /auth/mfa/daftar` (AC-12): the registration code.'
      required:
      - kode_pendaftaran
      properties:
        kode_pendaftaran:
          type: string
          description: The one-time code issued to this user; required, never reusable.
    DownstreamPool:
      type: object
      description: |-
        Downstream pool entity. `prioritas` is derived by the allocation: read-only
        here, always 1 in F0.
      required:
      - downstream_pool_id
      - nama
      - ttl_antrean_detik
      - upstream_pool_ids
      - prioritas
      - aktif
      properties:
        aktif:
          type: boolean
        downstream_pool_id:
          type: string
          format: uuid
        nama:
          type: string
        prioritas:
          type: integer
          format: int64
          description: Derived priority; read-only, always 1 in F0.
          example: 1
          readOnly: true
        ttl_antrean_detik:
          type: integer
          format: int64
        upstream_pool_ids:
          type: array
          items:
            type: string
            format: uuid
    DownstreamPoolConfig:
      type: object
      description: |-
        Downstream pool create/update body. Mode is not here: the path decides it
        (a downstream pool serves both `/sync` and `/async`). `prioritas` is derived
        by the allocation and never writable.
      required:
      - nama
      - upstream_pool_ids
      properties:
        alasan:
          type:
          - string
          - 'null'
          description: Reason; required on update.
          maxLength: 500
          minLength: 10
        nama:
          type: string
          description: Pool name; unique across downstream pools (schema `NOT NULL UNIQUE`).
          example: BGN MPM
        ttl_antrean_detik:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Queue TTL in seconds; default 86_400 (24 hours). Column
            `ttl_antrean_detik`.
          example: 86400
          minimum: 1
        upstream_pool_ids:
          type: array
          items:
            type: string
            format: uuid
          description: The upstream pools serving this downstream pool. Exactly one in F0.
          maxItems: 1
          minItems: 1
      additionalProperties: false
    EksporRequest:
      type: object
      description: |-
        `exportLogAuditor` body (R-18). Above 10,000 rows: 422
        `ekspor_terlalu_besar` without a file and with a `ditolak` audit row.
      required:
      - nik
      - dari
      - sampai
      - alasan
      properties:
        alasan:
          type: string
          example: Ekspor audit Q4 2026.
          maxLength: 500
          minLength: 10
        dari:
          type: string
          format: date-time
        nik:
          type: string
          example: '3175000000000001'
          pattern: ^[0-9]{16}$
        sampai:
          type: string
          format: date-time
      additionalProperties: false
    Endpoint:
      type: object
      description: Endpoint entity.
      required:
      - endpoint_id
      - provider_id
      - downstream_pool_id
      - parameter_literal
      - log_mode
      - metadata_fields
      - config_schema_version
      - endpoint_config_version
      - aktif
      properties:
        aktif:
          type: boolean
        config_schema_version:
          type: integer
          format: int64
          description: Fixed 1 in F0.
          example: 1
          maximum: 1
          minimum: 1
        downstream_pool_id:
          type: string
          format: uuid
        endpoint_config_version:
          type: integer
          format: int64
          example: 3
        endpoint_id:
          type: string
          format: uuid
        log_mode:
          type: string
          example: ringkas
        metadata_fields:
          type: array
          items:
            $ref: '#/components/schemas/MetadataFieldDef'
          description: |-
            Metadata field definitions; Dukcapil endpoints must include
            `status_penerima_manfaat` (M-R1).
        parameter_literal:
          type: object
          description: Literal parameters, including `TRESHOLD` (BGN mandate).
          additionalProperties:
            type: string
          propertyNames:
            type: string
        provider_id:
          type: string
          format: uuid
    EndpointConfig:
      type: object
      description: Endpoint configuration body (US-15; M-R1).
      required:
      - provider_id
      - downstream_pool_id
      - parameter_literal
      - log_mode
      - metadata_fields
      - config_schema_version
      properties:
        alasan:
          type:
          - string
          - 'null'
          description: Reason; required on update.
          maxLength: 500
          minLength: 10
        config_schema_version:
          type: integer
          format: int64
          description: Fixed 1 in F0.
          example: 1
          maximum: 1
          minimum: 1
        downstream_pool_id:
          type: string
          format: uuid
        log_mode:
          type: string
          example: ringkas
        metadata_fields:
          type: array
          items:
            $ref: '#/components/schemas/MetadataFieldDef'
          description: |-
            Metadata field definitions; Dukcapil endpoints must include
            `status_penerima_manfaat` (M-R1).
        parameter_literal:
          type: object
          description: Literal parameters, including `TRESHOLD` (BGN mandate).
          additionalProperties:
            type: string
          propertyNames:
            type: string
        provider_id:
          type: string
          format: uuid
      additionalProperties: false
    HasilK20:
      type: object
      description: K-20 execution result; the same numbers go to the config audit.
      required:
      - jumlah_cancelled
      - jumlah_failed
      - dilakukan_pada
      properties:
        dilakukan_pada:
          type: string
          format: date-time
        jumlah_cancelled:
          type: integer
          format: int64
        jumlah_failed:
          type: integer
          format: int64
    HasilWebhook:
      type: string
      description: Webhook delivery outcome (schema CHECK on `webhook_log.hasil`).
      enum:
      - terkirim
      - gagal_http
      - gagal_jaringan
      - ditolak_allowlist
      - gagal_internal
    JendelaKuota:
      type: string
      description: Periode kuota upstream pool.
      enum:
      - bergulir_24j
      - kalender
    JenisKredensial:
      type: string
      description: Jenis kredensial downstream. Hanya dua nilai ini yang ada.
      enum:
      - oauth2
      - api_key
    JenisObjek:
      type: string
      description: |-
        Jenis objek yang bisa dinonaktifkan. Dikirim di `jenis_objek` pada 403/503
        `objek_nonaktif`.
      enum:
      - endpoint
      - downstream_pool
      - upstream_pool
      - provider
    JumlahNamaTidakCocok:
      type: integer
      format: int32
      description: |-
        Count of failing names that are withheld instead of echoed (D6). A count of
        zero is never emitted: the field is absent when no name was withheld.
      minimum: 1
    KelasErrorWebhook:
      type: string
      description: |-
        Failure class of a webhook delivery (contract section 3.3). `provider_sementara`
        comes from rev 9 (contract v0.7.5 section 11 item 32c).
      enum:
      - timeout
      - koneksi
      - rate_limit_provider
      - respons_tidak_valid
      - tls
      - provider_sementara
    KodeMfaRequest:
      type: object
      description: 'Body of `POST /auth/mfa` (AC-10): exactly one of the two code kinds.'
      properties:
        kode:
          type:
          - string
          - 'null'
          description: Six-digit TOTP code.
          example: '123456'
        kode_pemulihan:
          type:
          - string
          - 'null'
          description: One of the 10 recovery codes issued at enrollment.
    KonfirmasiMfaRequest:
      type: object
      description: Body of `POST /auth/mfa/daftar/konfirmasi` (AC-13).
      required:
      - kode_totp
      properties:
        kode_totp:
          type: string
          example: '123456'
    KuotaTracker:
      type: object
      description: 'One quota tracker row (US-12; KP-07: numbers from the DB, not Redis).'
      required:
      - upstream_pool_id
      - periode_mulai
      - periode_selesai
      - kuota_harian
      - kuota_efektif
      - terpakai_periode
      - sisa_periode
      - porsi_sync_maks
      - terpakai_sync_jam_berjalan
      - terpakai_jam_berjalan
      - rate_limit_per_jam
      - dihitung_pada
      properties:
        dihitung_pada:
          type: string
          format: date-time
        kuota_efektif:
          type: integer
          format: int64
        kuota_harian:
          type: integer
          format: int64
        periode_mulai:
          type: string
          format: date-time
        periode_selesai:
          type: string
          format: date-time
        porsi_sync_maks:
          type: integer
          format: int64
        rate_limit_per_jam:
          type: integer
          format: int64
        sisa_periode:
          type: integer
          format: int64
        terpakai_jam_berjalan:
          type: integer
          format: int64
        terpakai_periode:
          type: integer
          format: int64
        terpakai_sync_jam_berjalan:
          type: integer
          format: int64
        upstream_pool_id:
          type: string
          format: uuid
    LogBaris:
      type: object
      description: |-
        One log row (US-14). `nik` is masked by the server for OP; never the
        client (U-1).
      required:
      - nik
      - requested_at
      - status_akses
      - kode_transaksi
      - queue_id
      - client_id
      - client_nama
      properties:
        client_id:
          type: string
          format: uuid
        client_nama:
          type: string
          description: Client name joined by the server (F-4); UI needs it for pagination.
          example: BGN MPM Production
        kode_transaksi:
          type: string
        nik:
          type: string
          description: 'Masked for OP: `************1234`; full for auditor searches.'
          example: '************1234'
        queue_id:
          type: string
          format: uuid
        requested_at:
          type: string
          format: date-time
        status_akses:
          type: string
          description: '`diizinkan` | `ditolak`.'
    LogCariRequest:
      type: object
      description: |-
        `searchLog` body (POST so filters stay out of the access log). Time range
        required. NIK or NIK fragments in any parameter are 403
        `pencarian_nik_dilarang` (US-16).
      required:
      - dari
      - sampai
      properties:
        client_id:
          type:
          - string
          - 'null'
          format: uuid
        dari:
          type: string
          format: date-time
        kode_transaksi:
          type:
          - string
          - 'null'
        kursor:
          type:
          - string
          - 'null'
        queue_id:
          type:
          - string
          - 'null'
          format: uuid
        sampai:
          type: string
          format: date-time
        status_akses:
          type:
          - string
          - 'null'
          description: '`diizinkan` | `ditolak`.'
      additionalProperties: false
    LogEntry:
      type: object
      description: Full one-entry log row (US-14). Masked for OP.
      required:
      - nik
      - requested_at
      - status_akses
      - kode_transaksi
      - queue_id
      - client_id
      - client_nama
      properties:
        client_id:
          type: string
          format: uuid
        client_nama:
          type: string
          example: BGN MPM Production
        kode_transaksi:
          type: string
        nik:
          type: string
          example: '************1234'
        queue_id:
          type: string
          format: uuid
        requested_at:
          type: string
          format: date-time
        status_akses:
          type: string
    LogMode:
      type: string
      description: |-
        What the transaction log keeps for a provider call. Closed set, the same
        values as the database `CHECK (log_mode IN ('metadata_only','full_payload'))`.
        A free string here let the contract advertise values the database rejects
        (AD5).
      enum:
      - metadata_only
      - full_payload
    LogPage:
      type: object
      description: Paginated log result.
      required:
      - baris
      - di_luar_retensi_online
      properties:
        baris:
          type: array
          items:
            $ref: '#/components/schemas/LogBaris'
        di_luar_retensi_online:
          type: boolean
          description: 'true: older rows live in cold storage and are not in this page.'
        kursor:
          type:
          - string
          - 'null'
    LoginRequest:
      type: object
      description: |-
        Login body. Two consecutive failures count against the limiter (5 per 15
        minutes per username).
      required:
      - username
      - password
      properties:
        password:
          type: string
        username:
          type: string
          example: auditor_01
      additionalProperties: false
    Me:
      type: object
      description: 'Current identity (U-1: "identitas, peran, client_id").'
      required:
      - pengguna_id
      - username
      - peran
      - mfa
      properties:
        bahasa_ui:
          oneOf:
          - $ref: '#/components/schemas/BahasaUi'
          - type: 'null'
        client_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Set only for `client_owner` sessions.
        mfa:
          $ref: '#/components/schemas/MeMfa'
          description: MFA state for this account (AC-14, MF3).
        pengguna_id:
          type: string
          format: uuid
        peran:
          type: array
          items:
            $ref: '#/components/schemas/Peran'
          description: Role granted to this user (contract section 8.1).
        username:
          type: string
          example: auditor_01
    MeMfa:
      type: object
      description: |-
        `Me.mfa` (AC-14): whether the step is required, whether it is enrolled, and
        how many recovery codes remain.
      required:
      - wajib
      - aktif
      - sisa_kode_pemulihan
      properties:
        aktif:
          type: boolean
          description: '`true` once a TOTP secret is confirmed (`pengguna_mfa.status = ''aktif''`).'
        sisa_kode_pemulihan:
          type: integer
          format: int64
          description: 'Unused recovery codes: 10 right after enrollment, 9 after one login.'
        wajib:
          type: boolean
          description: |-
            `true` when `POOLROUTER_MFA_WAJIB` is on and the caller's role is one
            the policy covers.
      additionalProperties: false
    MetadataFieldDef:
      type: object
      description: |-
        Metadata field definition (US-15). Also serialized: the endpoint entity
        returns it so the edit form can be pre-filled.
      required:
      - nama_field
      - tipe
      - wajib
      - klasifikasi
      - kirim_ke_data_balikan
      - deskripsi
      properties:
        aturan_validasi:
          type:
          - string
          - 'null'
          description: Validation rule reference, if any.
        deskripsi:
          type: string
        kirim_ke_data_balikan:
          type: boolean
          description: Whether the field is sent to the data-balikan callback.
        klasifikasi:
          type: string
          description: Classification (`rahasia` fields are never logged or sent to callbacks).
          example: internal
        nama_field:
          type: string
          example: status_penerima_manfaat
        nilai_diizinkan:
          type:
          - array
          - 'null'
          items:
            type: string
        tipe:
          type: string
          example: string
        wajib:
          type: boolean
    MetodeProvider:
      type: string
      description: |-
        HTTP method for the provider call (ADR-0002 D1). Only these two appear in
        the contract; `GET` may still carry a JSON body.
      enum:
      - GET
      - POST
    MfaDaftar:
      type: object
      description: '`POST /auth/mfa/daftar` response: shown once, never logged (AC-12).'
      required:
      - otpauth_uri
      - rahasia_base32
      properties:
        otpauth_uri:
          type: string
          description: '`otpauth://totp/...` for the authenticator app (issuer `PoolRouter`).'
          example: otpauth://totp/PoolRouter:auditor_01?secret=JBSWY3DPEHPK3PXP&issuer=PoolRouter
        rahasia_base32:
          type: string
          description: The same secret in base32, for manual entry.
    MfaKonfirmasi:
      type: object
      description: '`POST /auth/mfa/daftar/konfirmasi` response: the recovery codes, once (AC-13).'
      required:
      - kode_pemulihan
      properties:
        kode_pemulihan:
          type: array
          items:
            type: string
          description: 10 codes; each works once.
    NikCariRequest:
      type: object
      description: |-
        `searchLogByNik` body (auditor only; exact 16-digit NIK, no wildcard or
        prefix). One `audit_akses` `cari_nik` row per call, including page turns
        and empty results.
      required:
      - nik
      - dari
      - sampai
      - alasan
      properties:
        alasan:
          type: string
          example: Audit aduan W-2026-07.
          maxLength: 500
          minLength: 10
        dari:
          type: string
          format: date-time
        kursor:
          type:
          - string
          - 'null'
        nik:
          type: string
          example: '3175000000000001'
          pattern: ^[0-9]{16}$
        sampai:
          type: string
          format: date-time
      additionalProperties: false
    ParameterRule:
      type: object
      description: |-
        One provider parameter with an optional validation rule (US-03). Also
        serialized: the provider entity returns it for the edit form.
      required:
      - nama
      properties:
        nama:
          type: string
          description: Parameter name stored verbatim (`USER_ID`, `TRESHOLD`, `NAMA_LGKP`).
          example: USER_ID
        nilai:
          type:
          - string
          - 'null'
        rule:
          oneOf:
          - $ref: '#/components/schemas/RuleValidasi'
          - type: 'null'
    PayloadOpenRequest:
      type: object
      description: |-
        `openPayload` body (auditor only; exactly one of `request_id` or
        `kode_transaksi`).
      required:
      - alasan
      properties:
        alasan:
          type: string
          example: Riset banding aduan W-2026-07.
          maxLength: 500
          minLength: 10
        kode_transaksi:
          type:
          - string
          - 'null'
        request_id:
          type:
          - string
          - 'null'
          format: uuid
      additionalProperties: false
    PayloadView:
      type: object
      description: |-
        Payload view opened by an auditor (US-16). One `lihat_payload` row per
        opening; no cache.
      required:
      - request_id
      - kode_transaksi
      - status_akses
      - requested_at
      properties:
        hasil: {}
        input: {}
        kode_transaksi:
          type: string
        metadata: {}
        request_id:
          type: string
          format: uuid
        requested_at:
          type: string
          format: date-time
        status_akses:
          type: string
    Peran:
      type: string
      description: |-
        Peran admin. Daftar nilai tertutup; tiap pengguna hanya punya satu peran, dan
        `client_id` hanya diisi untuk `client_owner`.
      enum:
      - auditor
      - operator
      - platform_admin
      - client_owner
    Posisi:
      type: object
      description: |-
        Position inside the provider body template. Admin API only, validation of
        the template only — downstream bodies never carry it.
      required:
      - baris
      - kolom
      properties:
        baris:
          type: integer
          format: int64
          description: 1-based line in the body template.
          minimum: 1
        kolom:
          type: integer
          format: int64
          description: 1-based column in the body template.
          minimum: 1
    PratinjauK20:
      type: object
      description: |-
        K-20 preview (section 3a; no request_id, NIK or payload). Upstream pool
        previews add the last-active-upstream detail (section 3a.10).
      required:
      - akan_cancelled
      - akan_failed
      - dihitung_pada
      properties:
        akan_cancelled:
          type: integer
          format: int64
        akan_failed:
          type: integer
          format: int64
        dihitung_pada:
          type: string
          format: date-time
        dipakai_oleh_downstream_pool_count:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Upstream pool previews only: number of downstream pools allocated.'
        upstream_aktif_terakhir_untuk:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UpstreamAktifTerakhir'
          description: |-
            Upstream pool previews only: downstream pools whose last active
            upstream is this pool.
    PreferensiUpdate:
      type: object
      description: Preference update (Addendum A section 7.2). No user id is accepted.
      required:
      - bahasa_ui
      properties:
        bahasa_ui:
          $ref: '#/components/schemas/BahasaUi'
      additionalProperties: false
    ProblemAdmin:
      type: object
      description: |-
        RFC 9457 problem body for every admin 4xx/5xx. `detail` never contains
        input values, NIK or secrets (R-16).
      required:
      - type
      - title
      - status
      - kode
      properties:
        detail:
          type:
          - string
          - 'null'
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ValidasiErrorAdmin'
          description: Failing fields; only on 422 `validasi_gagal` and `metadata_tidak_valid`.
        jenis_objek:
          oneOf:
          - $ref: '#/components/schemas/JenisObjek'
            description: Kind of the inactive object; only on `objek_nonaktif`.
          - type: 'null'
        jumlah_nama_tidak_cocok:
          oneOf:
          - $ref: '#/components/schemas/JumlahNamaTidakCocok'
            description: Withheld-name count (D6); same rule as the downstream body.
          - type: 'null'
        kode:
          $ref: '#/components/schemas/ProblemKodeAdmin'
        request_id:
          type:
          - string
          - 'null'
          format: uuid
          description: '`request_id` the failure belongs to, when the operation names one.'
        status:
          type: integer
          format: int32
          description: HTTP status, 400..=599.
          maximum: 599
          minimum: 400
        title:
          type: string
        type:
          type: string
          description: Stable anchor `https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#<kode>`.
    ProblemKodeAdmin:
      type: string
      description: |-
        Admin (Web UI backend) codes. Not visible to external clients, so a new
        value here does not change the downstream contract.
      enum:
      - tidak_terautentikasi
      - kredensial_salah
      - login_dibatasi
      - origin_tidak_valid
      - akses_ditolak
      - pencarian_nik_dilarang
      - secret_dipakai
      - kredensial_dicabut
      - batas_kredensial
      - webhook_domain_tidak_diizinkan
      - webhook_tidak_https
      - metadata_wajib_hilang
      - ekspor_terlalu_besar
      - validasi_gagal
      - tidak_ditemukan
      - layanan_tidak_tersedia
    Provider:
      type: object
      description: |-
        Provider entity (list/get/create/update/activate responses). Every field of
        [`ProviderConfig`] except `alasan` is present, so the Web UI edit form
        (US-01/04) can be pre-filled from a read. Secrets never appear here:
        `body_template` only carries `{{secret.X}}` names, never secret values
        (R-16).
      required:
      - provider_id
      - nama
      - metode
      - base_url
      - body_template
      - parameters
      - respons_skema
      - tls_trust
      - log_mode
      - config_schema_version
      - provider_config_version
      - aktif
      properties:
        aktif:
          type: boolean
        base_url:
          type: string
          description: Provider base URL (https).
          example: https://provider.example.go.id/api
        body_template:
          type: string
          description: |-
            Body template. Placeholders `{{secret.X}}` reference a secret by name;
            the value is never returned.
          example: '{"NIK":"{{input.NIK}}","UID":"{{endpoint.USER_ID}}"}'
        config_schema_version:
          type: integer
          format: int64
          description: 1 in F0; 2 in F1. Mirrors `ProviderConfig::config_schema_version`.
          example: 1
          maximum: 2
          minimum: 1
        data_balikan:
          type: object
          description: |-
            Data balikan configuration block, present only for documents with
            config_schema_version = 2. Mirrors `ProviderConfig::data_balikan` so a
            read pre-fills the edit form and the full-replacement PUT keeps it.
        log_mode:
          $ref: '#/components/schemas/LogMode'
        metode:
          $ref: '#/components/schemas/MetodeProvider'
          description: HTTP method the provider call uses (ADR-0002 D1).
        nama:
          type: string
          description: Provider name, unique across the deployment (`provider.nama`).
          example: dukcapil-produksi
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ParameterRule'
          description: Provider parameters plus their validation rules.
        provider_config_version:
          type: integer
          format: int64
          example: 2
        provider_id:
          type: string
          format: uuid
        respons_skema:
          type: object
          description: Response schema used to map elements (US-05).
        tls_trust:
          $ref: '#/components/schemas/TlsTrust'
          description: TLS trust setting for the provider call (ADR-0002 D5).
    ProviderConfig:
      type: object
      description: Provider configuration body (`createProvider`/`updateProvider`, US-01/04).
      required:
      - nama
      - metode
      - base_url
      - body_template
      - parameters
      - respons_skema
      - tls_trust
      - log_mode
      - config_schema_version
      properties:
        alasan:
          type:
          - string
          - 'null'
          description: Reason; required on update (written to the config audit).
          maxLength: 500
          minLength: 10
        base_url:
          type: string
          description: Provider base URL (https).
          example: https://provider.example.go.id/api
        body_template:
          type: string
          description: |-
            Body template. Placeholders `{{secret.X}}` must reference an existing
            secret; `{{endpoint.*}}` must have a literal in the endpoint config.
          example: '{"NIK":"{{input.NIK}}","UID":"{{endpoint.USER_ID}}"}'
        config_schema_version:
          type: integer
          format: int64
          description: 1 in F0; 2 in F1. Other values are 422.
          example: 1
          maximum: 2
          minimum: 1
        data_balikan:
          type: object
          description: |-
            Data balikan configuration block; only valid when config_schema_version = 2 (AC-20).
            Ignored for version 1; required and validated for version 2.
        log_mode:
          $ref: '#/components/schemas/LogMode'
        metode:
          $ref: '#/components/schemas/MetodeProvider'
          description: |-
            HTTP method the provider call uses. `GET` with a body is allowed
            (ADR-0002 D1): the template is no longer tied to the method.
        nama:
          type: string
          description: |-
            Provider name, unique across the deployment (`provider.nama`). It is part
            of the body because `provider.nama` is NOT NULL UNIQUE, so the create
            call has to carry it (AD5).
          example: dukcapil-produksi
          maxLength: 200
          minLength: 1
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ParameterRule'
          description: Provider parameters plus their validation rules.
        respons_skema:
          type: object
          description: Response schema used to map elements (US-05).
        tls_trust:
          $ref: '#/components/schemas/TlsTrust'
          description: |-
            TLS trust setting for the provider call (ADR-0002 D5). Closed set: there
            is deliberately no "verify off" mode, not even in dev.
      additionalProperties: false
    RuleJenis:
      type: string
      description: |-
        Jenis rule validasi pada konfigurasi provider (BRD US-03). F0 tidak
        menyediakan rule kustom; nilai di luar enum ini ditolak 422.
      enum:
      - regex
      - enum
      - panjang
      - format_tanggal
    RuleValidasi:
      type: object
      description: |-
        Validation rule for a provider parameter (BRD US-03; closed `jenis`). Also
        serialized: the provider entity returns it for the edit form.
      required:
      - jenis
      properties:
        format_tanggal:
          type:
          - string
          - 'null'
          description: Date format for `jenis = format_tanggal`, e.g. `yyyy-MM-dd`.
        jenis:
          $ref: '#/components/schemas/RuleJenis'
        nilai_diizinkan:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Allowed values for `jenis = enum`.
        panjang_maks:
          type:
          - integer
          - 'null'
          format: int64
        panjang_min:
          type:
          - integer
          - 'null'
          format: int64
        pola:
          type:
          - string
          - 'null'
          description: Regex pattern for `jenis = regex`.
    SecretNilai:
      type: object
      description: '`putSecret` body; write-only value.'
      required:
      - nilai
      properties:
        nilai:
          type: string
          description: Secret value; never echoed back, never logged (R-16).
      additionalProperties: false
    SecretRingkas:
      type: object
      description: Secret list item. The value itself is never returned.
      required:
      - nama
      - tersamar
      - dipakai_oleh_provider_count
      properties:
        dipakai_oleh_provider_count:
          type: integer
          format: int64
        nama:
          type: string
          example: DUKCAPIL_PASSWORD
        tersamar:
          type: boolean
          description: 'true: masked in UI.'
    SesiStatus:
      type: object
      description: |-
        Session state (rev 5 section 3.6f). All fields required, UTC date-time.
        Closed object: no extra members.
      required:
      - idle_berakhir_pada
      - absolut_berakhir_pada
      - waktu_server
      properties:
        absolut_berakhir_pada:
          type: string
          format: date-time
        idle_berakhir_pada:
          type: string
          format: date-time
        waktu_server:
          type: string
          format: date-time
      additionalProperties: false
    StatusKredensial:
      type: string
      description: Credential lifecycle state (contract EN-02/EN-03, schema `status`).
      enum:
      - aktif
      - kedaluwarsa
      - dicabut
    TlsTrust:
      type: string
      description: |-
        TLS trust for the provider host (ADR-0002 D5). The three modes are the ones
        the configuration allows; disabling verification is deliberately not among
        them, not even in dev.
      enum:
      - system
      - ca_kustom
      - pin_spki
    UpstreamAktifTerakhir:
      type: object
      description: Last-active-upstream detail in a preview (section 3a.10).
      required:
      - downstream_pool_id
      - nama
      properties:
        downstream_pool_id:
          type: string
          format: uuid
        nama:
          type: string
    UpstreamPool:
      type: object
      description: |-
        Upstream pool entity (list/get/create/update/activate responses). Every field
        of [`UpstreamPoolConfig`] except `alasan` is present, so the Web UI edit form
        (US-04/05) can be pre-filled from a read: the `PUT` is a full replacement and
        a missing field would be submitted as a default, silently overwriting the
        current configuration.
      required:
      - upstream_pool_id
      - provider_id
      - kuota_harian
      - rate_limit_per_jam
      - porsi_sync
      - margin_kuota
      - batas_percobaan
      - retry_backoff_base_detik
      - retry_backoff_cap_detik
      - retry_rasio
      - retry_min_per_jam
      - jendela_kuota
      - reset_kuota_jam
      - reset_kuota_zona
      - jeda_min
      - jeda_maks
      - ambang_berdampingan
      - aktif
      properties:
        aktif:
          type: boolean
        ambang_berdampingan:
          type: integer
          format: int64
          description: Concurrency threshold (`ambang berdampingan`).
          example: 4
        batas_percobaan:
          type: integer
          format: int64
          description: 1..5 attempts (KP-01).
          example: 3
          maximum: 5
          minimum: 1
        jeda_maks:
          type: integer
          format: int64
          description: Maximum inter-request delay in milliseconds.
          example: 800
        jeda_min:
          type: integer
          format: int64
          description: Minimum inter-request delay in milliseconds.
          example: 200
        jendela_kuota:
          $ref: '#/components/schemas/JendelaKuota'
        kuota_harian:
          type: integer
          format: int64
          example: 500
          minimum: 1
        margin_kuota:
          type: number
          format: double
          description: 0.001..0.200 (KP-01).
          example: 0.05
          maximum: 0.2
          minimum: 0.001
        porsi_sync:
          type: number
          format: double
          description: Sync portion of the pool, 0.0..1.0.
          example: 0.1
          maximum: 1
          minimum: 0
        provider_id:
          type: string
          format: uuid
        rate_limit_per_jam:
          type: integer
          format: int64
          example: 60
          minimum: 1
        reset_kuota_jam:
          type: integer
          format: int64
          description: Hour of the period reset (0..23), interpreted in `reset_kuota_zona`.
          example: 0
          maximum: 23
          minimum: 0
        reset_kuota_zona:
          type: string
          description: IANA time zone; the offset is pinned to this zone (KP-02).
          example: Asia/Jakarta
        retry_backoff_base_detik:
          type: integer
          format: int64
          example: 2
        retry_backoff_cap_detik:
          type: integer
          format: int64
          example: 60
        retry_min_per_jam:
          type: integer
          format: int64
          example: 10
        retry_rasio:
          type: number
          format: double
          example: 0.5
        upstream_pool_id:
          type: string
          format: uuid
    UpstreamPoolConfig:
      type: object
      description: |-
        Upstream pool configuration body (US-04/05; KP-01/KP-02 ranges enforced
        server-side with 422, SHAA-280).

        Ranges follow KP-01 (ADR-0001 section 5a "Parameter per upstream pool dan
        rentangnya") exactly as decided for SHAA-280; the table lives in
        `backend/openapi/DESIGN.md` section 3.2 and `KP01` in `api/tests.rs` asserts
        it on the generated document.

        Seven fields are **required with no default**, so the server never silently
        picks a value the operator did not choose: `provider_id`, `jeda_min`,
        `jeda_maks`, `ambang_berdampingan`, `kuota_harian`, `rate_limit_per_jam`, and
        `porsi_sync`. The remaining parameters keep the KP-01 defaults.

        Bounds that `minimum`/`maximum` cannot express are documented here and
        enforced by [`UpstreamPoolConfig::validate`] (wiring into the handlers
        follows SHAA-175):
        - `retry_backoff_cap_detik` must be greater than or equal to
          `retry_backoff_base_detik`;
        - `jeda_maks` must be greater than or equal to `jeda_min`;
        - both `jeda_min` and `jeda_maks` must be at most
          `floor(3_600_000 / rate_limit_per_jam)` milliseconds. That is the mean
          inter-request spacing the hourly rate limit allows, so a longer pause
          would drop the pool below `rate_limit_per_jam` on its own. The `maximum`
          of 60_000 below is only the static ceiling for `rate_limit_per_jam = 60`
          and above; for example `rate_limit_per_jam = 36_000` caps both delays at
          100 ms.

        The `example` values are deliberately values a caller could send, not the
        defaults.
      required:
      - provider_id
      - kuota_harian
      - rate_limit_per_jam
      - porsi_sync
      - margin_kuota
      - batas_percobaan
      - retry_backoff_base_detik
      - retry_backoff_cap_detik
      - retry_rasio
      - retry_min_per_jam
      - jendela_kuota
      - reset_kuota_jam
      - reset_kuota_zona
      - jeda_min
      - jeda_maks
      - ambang_berdampingan
      properties:
        alasan:
          type:
          - string
          - 'null'
          description: |-
            Reason; required on update, and required with `kalender` (source of
            certainty of the calendar window).
          maxLength: 500
          minLength: 10
        ambang_berdampingan:
          type: integer
          format: int64
          description: |-
            Concurrency threshold (`ambang berdampingan`, US-22), at least 1 with no
            upper bound. Required: no default.
          example: 8
          minimum: 1
        batas_percobaan:
          type: integer
          format: int64
          description: Attempts per request, 1..=5 (KP-01). Default 3.
          default: 3
          example: 2
          maximum: 5
          minimum: 1
        jeda_maks:
          type: integer
          format: int64
          description: |-
            Maximum inter-request delay in milliseconds, 0..=60_000 and at most
            `floor(3_600_000 / rate_limit_per_jam)`, and never below `jeda_min`
            (cross-field 422). Required: no default.
          example: 1500
          maximum: 60000
          minimum: 0
        jeda_min:
          type: integer
          format: int64
          description: |-
            Minimum inter-request delay in milliseconds, 0..=60_000 and at most
            `floor(3_600_000 / rate_limit_per_jam)` (cross-field 422). Required: no
            default.
          example: 250
          maximum: 60000
          minimum: 0
        jendela_kuota:
          $ref: '#/components/schemas/JendelaKuota'
        kuota_harian:
          type: integer
          format: int64
          description: |-
            Daily upstream quota, at least 1 with no upper bound (range kept as it
            was before SHAA-280). Required: no default, so a create must state the
            quota it wants.
          example: 500
          minimum: 1
        margin_kuota:
          type: number
          format: double
          description: Quota reservation margin, 0.001..0.200 (KP-01). Default 0.01.
          default: 0.01
          example: 0.05
          maximum: 0.2
          minimum: 0.001
        porsi_sync:
          type: number
          format: double
          description: |-
            Sync portion of the pool, 0.0..1.0 (KP-01: `porsi_sync_maks`). Required:
            no default.
          example: 0.1
          maximum: 1
          minimum: 0
        provider_id:
          type: string
          format: uuid
        rate_limit_per_jam:
          type: integer
          format: int64
          description: |-
            Upstream rate limit per hour, at least 1 with no upper bound (range kept
            as it was before SHAA-280). Required: no default. Also caps
            `jeda_min`/`jeda_maks` at `floor(3_600_000 / rate_limit_per_jam)`
            milliseconds.
          example: 60
          minimum: 1
        reset_kuota_jam:
          type: integer
          format: int64
          description: Hour of the period reset (0..=23), interpreted in `reset_kuota_zona`.
          default: 0
          example: 0
          maximum: 23
          minimum: 0
        reset_kuota_zona:
          type: string
          description: IANA time zone; the offset is pinned to this zone (KP-02).
          default: Asia/Jakarta
          example: Asia/Jayapura
        retry_backoff_base_detik:
          type: integer
          format: int64
          description: Backoff base in seconds, 1..=300 (KP-01). Default 5.
          default: 5
          example: 2
          maximum: 300
          minimum: 1
        retry_backoff_cap_detik:
          type: integer
          format: int64
          description: |-
            Backoff cap in seconds, `retry_backoff_base_detik`..=3600. The lower
            bound is per request, not a fixed `minimum`: `retry_backoff_cap_detik`
            must be greater than or equal to `retry_backoff_base_detik` (cross-field
            422, see [`UpstreamPoolConfig::validate`]). Default 300.
          default: 300
          example: 60
          maximum: 3600
          minimum: 1
        retry_min_per_jam:
          type: integer
          format: int64
          description: Retry budget floor per hour, 0..=10_000 (KP-01). Default 20.
          default: 20
          example: 10
          maximum: 10000
          minimum: 0
        retry_rasio:
          type: number
          format: double
          description: |-
            Retry budget as a ratio of `kuota_harian`, 0.0..=0.5 (KP-01).
            Default 0.1.
          default: 0.1
          example: 0.5
          maximum: 0.5
          minimum: 0
      additionalProperties: false
    ValidasiErrorAdmin:
      type: object
      description: |-
        One failing field, admin. Field names are usually JSON pointers into the
        request body; template errors carry `posisi`.
      required:
      - field
      - kode
      properties:
        batas:
          type: number
          format: double
          description: |-
            Numeric rule parameter of the violated rule, if any. Optional: absent
            when the rule has no numeric parameter (for example `wajib` or an
            unknown rule). When present the value is always a number, never `null`.
        field:
          type: string
          description: |-
            Name of the rejected field exactly as sent, or a JSON pointer for
            admin request bodies and template errors (D6).
        kode:
          type: string
        nama:
          type:
          - string
          - 'null'
          description: |-
            Name of the parameter or secret the template referenced and that does
            not exist (AC-13, U-46). Echoed so the UI can offer to create it; it is a
            name the operator typed, never a value. Absent for every other error.
        posisi:
          oneOf:
          - $ref: '#/components/schemas/Posisi'
            description: Template position. Admin API and template errors only.
          - type: 'null'
    WebhookConfig:
      type: object
      description: Webhook configuration view; the secret itself is never returned.
      required:
      - aktif
      properties:
        aktif:
          type: boolean
        secret_versi:
          type:
          - integer
          - 'null'
          format: int64
        webhook_url:
          type:
          - string
          - 'null'
    WebhookConfigPut:
      type: object
      description: |-
        `putWebhookConfig` body (US-06). Domain must be allowlisted and https;
        checked on save and on send.
      required:
      - webhook_url
      - aktif
      properties:
        aktif:
          type: boolean
        webhook_url:
          type: string
          example: https://mpm.example.go.id/webhook/poolrouter
      additionalProperties: false
    WebhookLog:
      type: object
      description: One webhook delivery (US-06).
      required:
      - request_id
      - sent_at
      - hasil
      properties:
        error_class:
          oneOf:
          - $ref: '#/components/schemas/KelasErrorWebhook'
          - type: 'null'
        hasil:
          $ref: '#/components/schemas/HasilWebhook'
        http_status:
          type:
          - integer
          - 'null'
          format: int64
        request_id:
          type: string
          format: uuid
        secret_versi:
          type:
          - integer
          - 'null'
          format: int64
        sent_at:
          type: string
          format: date-time
    WebhookSecret:
      type: object
      description: |-
        Rotated webhook secret; returned exactly once (F-5). Creating the first
        secret sets `secret_versi: 1`.
      required:
      - secret_versi
      - secret
      properties:
        secret:
          type: string
          description: '`whsec_` + 32-byte base64 (Standard Webhooks).'
          example: whsec_2fJ8N0qk0e6h7h0F1D2J3k4L5m6N7o8P9Q0r1S2t3U4v
        secret_versi:
          type: integer
          format: int64
  responses:
    Problem400Admin:
      description: Body bukan JSON yang sah
      headers:
        Cache-Control:
          schema:
            type: string
          description: Selalu no-store (R-16)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemAdmin'
          examples:
            validasi_gagal:
              summary: JSON tidak dapat diurai
              value:
                kode: validasi_gagal
                status: 400
                title: Validasi gagal
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#validasi_gagal
    Problem401Admin:
      description: Tanpa sesi (401) atau kredensial login salah; penyebab tidak dibedakan (U-1)
      headers:
        Cache-Control:
          schema:
            type: string
          description: Selalu no-store (R-16)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemAdmin'
          examples:
            kredensial_salah:
              summary: Username atau password salah (tidak dibedakan)
              value:
                kode: kredensial_salah
                status: 401
                title: Kredensial salah
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#kredensial_salah
            tidak_terautentikasi:
              summary: Tanpa sesi atau sesi kedaluwarsa
              value:
                kode: tidak_terautentikasi
                status: 401
                title: Tidak terautentikasi
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#tidak_terautentikasi
    Problem403Admin:
      description: Peran di luar kolom (akses_ditolak), Origin tidak sah pada tulis (origin_tidak_valid), atau pencarian NIK di luar jalur auditor (pencarian_nik_dilarang)
      headers:
        Cache-Control:
          schema:
            type: string
          description: Selalu no-store (R-16)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemAdmin'
          examples:
            akses_ditolak:
              summary: Peran tidak termasuk kolom Peran operasi
              value:
                kode: akses_ditolak
                status: 403
                title: Akses ditolak
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#akses_ditolak
            origin_tidak_valid:
              summary: Tulis tanpa Origin yang sah
              value:
                kode: origin_tidak_valid
                status: 403
                title: Origin tidak valid
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#origin_tidak_valid
            pencarian_nik_dilarang:
              summary: Parameter memuat NIK atau potongannya
              value:
                kode: pencarian_nik_dilarang
                status: 403
                title: Pencarian NIK dilarang
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#pencarian_nik_dilarang
    Problem404Admin:
      description: Objek tidak ditemukan
      headers:
        Cache-Control:
          schema:
            type: string
          description: Selalu no-store (R-16)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemAdmin'
          examples:
            tidak_ditemukan:
              summary: Id atau kode transaksi tidak dikenal
              value:
                kode: tidak_ditemukan
                status: 404
                title: Tidak ditemukan
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#tidak_ditemukan
    Problem409Admin:
      description: Secret masih dipakai provider aktif (secret_dipakai), kredensial masih dipakai endpoint (kredensial_dicabut), atau batas dua kredensial aktif per client (batas_kredensial)
      headers:
        Cache-Control:
          schema:
            type: string
          description: Selalu no-store (R-16)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemAdmin'
          examples:
            batas_kredensial:
              summary: Sudah ada dua kredensial aktif
              value:
                kode: batas_kredensial
                status: 409
                title: Batas kredensial tercapai
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#batas_kredensial
            kredensial_dicabut:
              summary: 'Kredensial masih dipakai endpoint aktif; U-54b: aktifkan ulang selalu 409'
              value:
                kode: kredensial_dicabut
                status: 409
                title: Kredensial masih dipakai
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#kredensial_dicabut
            secret_dipakai:
              summary: Daftar provider aktif yang memakai secret ada di detail
              value:
                detail: Masih dipakai 1 provider aktif.
                kode: secret_dipakai
                status: 409
                title: Secret masih dipakai
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#secret_dipakai
    Problem422Admin:
      description: Validasi gagal; termasuk template tidak seimbang (dengan posisi), {{secret.X}} tidak ada (nama secret di errors), config_schema_version salah, webhook tidak https / di luar allowlist, metadata wajib hilang (M-R1), atau ekspor di atas 10.000 baris
      headers:
        Cache-Control:
          schema:
            type: string
          description: Selalu no-store (R-16)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemAdmin'
          examples:
            ekspor_terlalu_besar:
              summary: Lebih dari 10.000 baris; tanpa berkas, baris audit ditolak (R-18)
              value:
                kode: ekspor_terlalu_besar
                status: 422
                title: Ekspor terlalu besar
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#ekspor_terlalu_besar
            metadata_wajib_hilang:
              summary: Endpoint Dukcapil tanpa status_penerima_manfaat (M-R1)
              value:
                errors:
                - field: /metadata_fields
                  kode: wajib_hilang
                kode: metadata_wajib_hilang
                status: 422
                title: Metadata wajib hilang
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#metadata_wajib_hilang
            validasi_gagal:
              summary: Template body tidak seimbang; posisi menunjuk baris/kolom (U-9)
              value:
                errors:
                - field: /body_template
                  kode: template_tidak_seimbang
                  posisi:
                    baris: 2
                    kolom: 18
                kode: validasi_gagal
                status: 422
                title: Validasi gagal
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#validasi_gagal
            webhook_domain_tidak_diizinkan:
              summary: Domain di luar allowlist
              value:
                kode: webhook_domain_tidak_diizinkan
                status: 422
                title: Domain webhook tidak diizinkan
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#webhook_domain_tidak_diizinkan
            webhook_tidak_https:
              summary: URL webhook bukan https
              value:
                kode: webhook_tidak_https
                status: 422
                title: Webhook bukan https
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#webhook_tidak_https
    Problem429Admin:
      description: Limiter login aktif
      headers:
        Cache-Control:
          schema:
            type: string
          description: Selalu no-store (R-16)
        Retry-After:
          schema:
            type: string
          description: Detik hingga percobaan berikutnya (GCRA)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemAdmin'
          examples:
            login_dibatasi:
              summary: 5 kali gagal dalam 15 menit
              value:
                kode: login_dibatasi
                status: 429
                title: Login dibatasi
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#login_dibatasi
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-pr_session
      description: Cookie sesi admin; HttpOnly, Secure, SameSite=Strict (ADR-0003 section 3.6)
tags:
- name: admin
  description: Backend Web UI admin (kontrak review SHAA-175)
