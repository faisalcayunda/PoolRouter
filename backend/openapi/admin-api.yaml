openapi: 3.1.0
info:
  title: PoolRouter Admin API
  description: 'Kontrak admin PoolRouter F0 (SHAA-175): sesi cookie, konfigurasi, K-20, kuota, log/audit. Error memakai RFC 9457 problem+json dengan kode tertutup (Addendum A); rincian tiap kode ada di docs/masalah.md. Tulis hanya dari Origin yang sah; setiap tulis tercatat di audit konfigurasi.'
  license:
    name: UNLICENSED
    identifier: UNLICENSED
  version: 0.1.0
paths:
  /admin/v1/auditor/audit-akses/cari:
    post:
      tags:
      - admin
      summary: |-
        Auditor search of `audit_akses` (who did what, when, how long; without
        `nik_hmac`). Range max 31 days.
      operationId: searchAuditAkses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditCariRequest'
        required: true
      responses:
        '200':
          description: Halaman baris audit akses
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditAksesPage'
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
          $ref: '#/components/responses/Problem403Admin'
        '422':
          $ref: '#/components/responses/Problem422Admin'
      security:
      - sessionCookie: []
  /admin/v1/auditor/log/cari-nik:
    post:
      tags:
      - admin
      summary: |-
        Auditor-only NIK search (exact 16 digits; no wildcard, prefix or partial
        NIK). Every call gets an `audit_akses` `cari_nik` row, including page
        turns and empty results.
      operationId: searchLogByNik
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NikCariRequest'
        required: true
      responses:
        '200':
          description: Baris log dengan NIK utuh
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPage'
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
          $ref: '#/components/responses/Problem403Admin'
        '422':
          $ref: '#/components/responses/Problem422Admin'
      security:
      - sessionCookie: []
  /admin/v1/auditor/log/ekspor:
    post:
      tags:
      - admin
      summary: |-
        Auditor CSV export (R-18): `Content-Disposition: attachment`,
        `Cache-Control: no-store`, `Repr-Digest: sha-256=...`,
        `Accept-Ranges: none`. Above 10,000 rows: 422 `ekspor_terlalu_besar`,
        no file, `ditolak` audit row.
      operationId: exportLogAuditor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EksporRequest'
        required: true
      responses:
        '200':
          description: Berkas CSV
          headers:
            Accept-Ranges:
              schema:
                type: string
              description: Selalu none
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename=...
            Repr-Digest:
              schema:
                type: string
              description: sha-256=<digest base64>
          content:
            text/csv:
              schema:
                type: string
              examples:
                csv:
                  summary: Dua baris contoh
                  value: |
                    nik,requested_at,status_akses,kode_transaksi,queue_id,client_id
                    3175000000000001,2026-11-03T01:02:03Z,diizinkan,PRQ-20261103-000001,0b19c3b4-7c5f-4e2f-9b3a-1a2b3c4d5e6f,c1d2e3f4-0000-0000-0000-000000000001
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
          $ref: '#/components/responses/Problem403Admin'
        '422':
          $ref: '#/components/responses/Problem422Admin'
      security:
      - sessionCookie: []
  /admin/v1/auditor/payload:
    post:
      tags:
      - admin
      summary: |-
        Open a payload view (auditor only). One `audit_akses` `lihat_payload` row
        per opening.
      operationId: openPayload
      requestBody:
        description: Tepat satu dari request_id atau kode_transaksi; alasan wajib
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadOpenRequest'
        required: true
      responses:
        '200':
          description: Payload permintaan (tanpa rahasia)
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadView'
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
          $ref: '#/components/responses/Problem403Admin'
        '404':
          $ref: '#/components/responses/Problem404Admin'
        '422':
          $ref: '#/components/responses/Problem422Admin'
      security:
      - sessionCookie: []
  /admin/v1/auth/login:
    post:
      tags:
      - admin
      summary: Login (ADR-0003 section 3.6). Success sets `__Host-pr_session` cookie.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '204':
          description: Login berhasil; cookie sesi diterbitkan
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
            Set-Cookie:
              schema:
                type: string
              description: __Host-pr_session=...; HttpOnly; Secure; SameSite=Strict; Path=/
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '422':
          $ref: '#/components/responses/Problem422Admin'
        '429':
          $ref: '#/components/responses/Problem429Admin'
      security:
      - {}
  /admin/v1/auth/logout:
    post:
      tags:
      - admin
      summary: 'Logout: cookie expired.'
      operationId: logout
      responses:
        '204':
          description: Sesi diakhiri; cookie kedaluwarsa
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
            Set-Cookie:
              schema:
                type: string
              description: __Host-pr_session=; Max-Age=0; HttpOnly; Secure; SameSite=Strict; Path=/
        '401':
          $ref: '#/components/responses/Problem401Admin'
      security:
      - sessionCookie: []
  /admin/v1/auth/me:
    get:
      tags:
      - admin
      summary: Current identity (U-1).
      operationId: getMe
      responses:
        '200':
          description: Identitas sesi saat ini
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem401Admin'
      security:
      - sessionCookie: []
  /admin/v1/auth/me/preferensi:
    patch:
      tags:
      - admin
      summary: UI preference update (Addendum A section 7.2).
      operationId: updatePreferensi
      requestBody:
        description: Tanpa id pengguna; hanya bahasa UI sendiri
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferensiUpdate'
        required: true
      responses:
        '200':
          description: Preferensi tersimpan
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferensiUpdate'
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
          $ref: '#/components/responses/Problem403Admin'
        '422':
          $ref: '#/components/responses/Problem422Admin'
      security:
      - sessionCookie: []
  /admin/v1/auth/mfa:
    post:
      tags:
      - admin
      summary: 'Second login step: TOTP or a recovery code (ADR-0006 §9, AC-10).'
      description: |-
        Reads the `__Host-pr_mfa` pre-session cookie; on success sets
        `__Host-pr_session` and clears the pre-session cookie.
      operationId: mfaVerifikasi
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KodeMfaRequest'
        required: true
      responses:
        '204':
          description: Kode diterima; cookie sesi diterbitkan
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
            Set-Cookie:
              schema:
                type: string
              description: __Host-pr_session=...; HttpOnly; Secure; SameSite=Strict; Path=/
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '422':
          $ref: '#/components/responses/Problem422Admin'
        '429':
          $ref: '#/components/responses/Problem429Admin'
      security:
      - {}
  /admin/v1/auth/mfa/daftar:
    post:
      tags:
      - admin
      summary: 'Start MFA enrollment: returns the `otpauth://` URI once (AC-12).'
      operationId: mfaDaftar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DaftarMfaRequest'
        required: true
      responses:
        '200':
          description: URI otpauth dan secret base32; ditampilkan sekali
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaDaftar'
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
          $ref: '#/components/responses/Problem403Admin'
      security:
      - {}
  /admin/v1/auth/mfa/daftar/konfirmasi:
    post:
      tags:
      - admin
      summary: Confirm enrollment with one TOTP code; returns the 10 recovery codes (AC-13).
      operationId: mfaKonfirmasi
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KonfirmasiMfaRequest'
        required: true
      responses:
        '200':
          description: MFA aktif; kode pemulihan dan cookie sesi diterbitkan
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
            Set-Cookie:
              schema:
                type: string
              description: __Host-pr_session=...; HttpOnly; Secure; SameSite=Strict; Path=/
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaKonfirmasi'
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
          $ref: '#/components/responses/Problem403Admin'
        '422':
          $ref: '#/components/responses/Problem422Admin'
      security:
      - {}
  /admin/v1/auth/sesi:
    get:
      tags:
      - admin
      summary: Session state; does not shift the idle window (rev 5 section 3.6f).
      operationId: getSesi
      responses:
        '200':
          description: Status sesi; idle tidak digeser
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesiStatus'
              examples:
                sesi:
                  summary: Sesi aktif; seluruh field wajib
                  value:
                    absolut_berakhir_pada: 2026-11-06T18:00:00Z
                    idle_berakhir_pada: 2026-11-06T10:30:00Z
                    waktu_server: 2026-11-06T10:00:00Z
        '401':
          $ref: '#/components/responses/Problem401Admin'
      security:
      - sessionCookie: []
  /admin/v1/auth/sesi/perpanjang:
    post:
      tags:
      - admin
      summary: |-
        Extend the session: resets idle, never shifts the absolute limit, no
        Set-Cookie (rev 5 section 3.6f).
      operationId: perpanjangSesi
      responses:
        '200':
          description: Idle di-reset; batas absolut tetap; tanpa Set-Cookie
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesiStatus'
              examples:
                sesi:
                  summary: Idle digeser ke +30 menit; absolut tidak berubah
                  value:
                    absolut_berakhir_pada: 2026-11-06T18:00:00Z
                    idle_berakhir_pada: 2026-11-06T10:30:00Z
                    waktu_server: 2026-11-06T10:00:00Z
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
          $ref: '#/components/responses/Problem403Admin'
      security:
      - sessionCookie: []
  /admin/v1/clients:
    get:
      tags:
      - admin
      summary: List clients (PA; CO sees only its own client).
      operationId: listClients
      responses:
        '200':
          description: Daftar client (CO hanya clientnya)
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
          $ref: '#/components/responses/Problem403Admin'
      security:
      - sessionCookie: []
    post:
      tags:
      - admin
      summary: Create client (PA; L-04 limiter ranges).
      operationId: createClient
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientConfig'
        required: true
      responses:
        '201':
          description: Client dibuat
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
          $ref: '#/components/responses/Problem403Admin'
        '422':
          $ref: '#/components/responses/Problem422Admin'
      security:
      - sessionCookie: []
  /admin/v1/clients/{id}:
    get:
      tags:
      - admin
      summary: Get one client (PA; CO only its own).
      operationId: getClient
      parameters:
      - name: id
        in: path
        description: client_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Detail client
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
          $ref: '#/components/responses/Problem403Admin'
        '404':
          $ref: '#/components/responses/Problem404Admin'
      security:
      - sessionCookie: []
    put:
      tags:
      - admin
      summary: Update client (PA). `alasan` wajib saat mengubah limiter.
      operationId: updateClient
      parameters:
      - name: id
        in: path
        description: client_id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: alasan wajib saat ubah limiter
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientConfig'
        required: true
      responses:
        '200':
          description: Client diperbarui
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
          $ref: '#/components/responses/Problem403Admin'
        '404':
          $ref: '#/components/responses/Problem404Admin'
        '422':
          $ref: '#/components/responses/Problem422Admin'
      security:
      - sessionCookie: []
  /admin/v1/clients/{id}/aktifkan:
    post:
      tags:
      - admin
      summary: |-
        Activate a client (section 3a.1). No re-verification required. Applies to
        requests submitted after this call, needs no K-20 dialog, and is recorded in
        the configuration audit log.
      operationId: aktifkanClient
      parameters:
      - name: id
        in: path
        description: client_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Client aktif
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
          $ref: '#/components/responses/Problem403Admin'
        '404':
          $ref: '#/components/responses/Problem404Admin'
      security:
      - sessionCookie: []
  /admin/v1/clients/{id}/credentials:
    get:
      tags:
      - admin
      summary: List client credentials (PA; CO its own client). No hashes.
      operationId: listCredentials
      parameters:
      - name: id
        in: path
        description: client_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Kredensial client tanpa hash
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Credential'
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
          $ref: '#/components/responses/Problem403Admin'
      security:
      - sessionCookie: []
    post:
      tags:
      - admin
      summary: |-
        Create a client credential (PA; CO its own client). Secret returned
        exactly once, 256-bit base64url; max two active per client.
      operationId: createCredential
      parameters:
      - name: id
        in: path
        description: client_id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Default dan maksimum kedaluwarsa 365 hari
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreate'
        required: true
      responses:
        '201':
          description: Kredensial dibuat; secret tampil sekali
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store; secret tidak boleh tersimpan (R-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialSecret'
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
          $ref: '#/components/responses/Problem403Admin'
        '409':
          $ref: '#/components/responses/Problem409Admin'
        '422':
          $ref: '#/components/responses/Problem422Admin'
      security:
      - sessionCookie: []
  /admin/v1/clients/{id}/endpoints:
    put:
      tags:
      - admin
      summary: Replace the client-endpoint assignment (PA; U-7 shape).
      operationId: setClientEndpoints
      parameters:
      - name: id
        in: path
        description: client_id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Penugasan lengkap menggantikan penugasan sebelumnya (U-7)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientEndpoints'
        required: true
      responses:
        '200':
          description: Penugasan tersimpan
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
          $ref: '#/components/responses/Problem403Admin'
        '422':
          $ref: '#/components/responses/Problem422Admin'
      security:
      - sessionCookie: []
  /admin/v1/clients/{id}/nonaktifkan:
    post:
      tags:
      - admin
      summary: |-
        Deactivate a client (K-20): cancel queued, fail waiting-for-retry, expire
        the rest. Same numbers go to the config audit.
      operationId: nonaktifkanClient
      parameters:
      - name: id
        in: path
        description: client_id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlasanK20'
        required: true
      responses:
        '200':
          description: Eksekusi selesai; jumlah cancel/fail dicatat di audit konfigurasi
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HasilK20'
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
          $ref: '#/components/responses/Problem403Admin'
        '404':
          $ref: '#/components/responses/Problem404Admin'
        '422':
          $ref: '#/components/responses/Problem422Admin'
      security:
      - sessionCookie: []
  /admin/v1/clients/{id}/pratinjau-nonaktif:
    get:
      tags:
      - admin
      summary: |-
        Preview client deactivation: cancels `queued`/`processing` requests of the
        client, fails the rest (waiting for retry with attempt_count > 0, expired
        with remaining TTL). No request_id, NIK or payload.
      operationId: pratinjauNonaktifkanClient
      parameters:
      - name: id
        in: path
        description: client_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Pratinjau dampak per status
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PratinjauK20'
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
          $ref: '#/components/responses/Problem403Admin'
        '404':
          $ref: '#/components/responses/Problem404Admin'
      security:
      - sessionCookie: []
  /admin/v1/clients/{id}/webhook:
    get:
      tags:
      - admin
      summary: |-
        Webhook configuration of one client (PA; CO its own client). 404 when
        never configured.
      operationId: getWebhookConfig
      parameters:
      - name: id
        in: path
        description: client_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Konfigurasi webhook; secret tidak pernah dikembalikan
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookConfig'
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
          $ref: '#/components/responses/Problem403Admin'
        '404':
          $ref: '#/components/responses/Problem404Admin'
      security:
      - sessionCookie: []
    put:
      tags:
      - admin
      summary: |-
        Save webhook configuration (US-06). URL must be https and its host in the
        allowlist; checked on save and on send.
      operationId: putWebhookConfig
      parameters:
      - name: id
        in: path
        description: client_id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookConfigPut'
        required: true
      responses:
        '200':
          description: Konfigurasi tersimpan
          headers:
            Cache-Control:
              schema:
                type: string
