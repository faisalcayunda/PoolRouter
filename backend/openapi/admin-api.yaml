          description: Pratinjau plus upstream_aktif_terakhir_untuk dan dipakai_oleh_downstream_pool_count
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu no-store (R-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PratinjauK20'
        '401':
          $ref: '#/components/responses/Problem401Admin'
        '403':
