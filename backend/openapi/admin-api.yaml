      tags:
      - admin
      summary: |-
        Preview upstream pool deactivation (K-20; section 3a.10): cancels/fails
        requests across allocated pools, and shows where this pool is the last
        active upstream.
      operationId: pratinjauNonaktifkanUpstreamPool
      parameters:
      - name: id
        in: path
        description: upstream_pool_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
