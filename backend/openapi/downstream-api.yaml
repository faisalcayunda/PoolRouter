openapi: 3.1.0
info:
  title: PoolRouter Downstream API
  description: API publik PoolRouter untuk klien BGN. Error memakai RFC 9457 problem+json dengan daftar `kode` tertutup; rincian tiap kode, termasuk `batas`, ada di docs/masalah.md. Semua respons selalu `no-store`; respons tidak boleh disimpan cache.
  license:
    name: UNLICENSED
    identifier: UNLICENSED
  version: 0.1.0
paths:
  /v1/endpoints/{endpoint_id}/async:
    post:
      tags:
      - downstream
      summary: |-
        Pengiriman asinkron: permintaan masuk antrean dan statusnya diperiksa lewat
        polling atau webhook. Header `Idempotency-Key` opsional: kunci dan sidik yang
        sama diulang menghasilkan 200 berisi status terkini; kunci sama dengan sidik
        berbeda menghasilkan 422 `idempotency_key_konflik`.
      operationId: enqueueAsync
      parameters:
      - name: endpoint_id
        in: path
        description: Endpoint asinkron; path menentukan mode
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        description: Opsional; 1–128 karakter ASCII printable (0x20–0x7E). Kunci sama + sidik sama → 200 replay; kunci sama + sidik beda → 422
        required: false
        schema:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[ -~]{1,128}$
      requestBody:
        description: Amplop input + metadata dengan additionalProperties false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
            example:
              input:
                NAMA_LGKP: Budi Santoso
                NIK: '3201234567890001'
              metadata:
                status_penerima_manfaat: sesuai
        required: true
      responses:
        '200':
          description: Replay kunci idempoten yang sudah ada; tidak ada request baru
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnqueueResponse'
              examples:
                replay:
                  summary: Kunci dan sidik sama
                  value:
                    queue_id: 0b19c3b4-7c5f-4e2f-9b3a-1a2b3c4d5e6f
                    status: done
        '202':
          description: Request baru masuk antrean
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnqueueResponse'
              examples:
                queued:
                  summary: Request baru
                  value:
                    queue_id: 0b19c3b4-7c5f-4e2f-9b3a-1a2b3c4d5e6f
                    status: queued
        '400':
          $ref: '#/components/responses/Problem400Down'
        '401':
          $ref: '#/components/responses/Problem401Down'
        '403':
          $ref: '#/components/responses/Problem403ObjekNonaktif'
        '404':
          $ref: '#/components/responses/Problem404Down'
        '422':
          description: Field tak dikenal, metadata tidak valid, atau kunci idempoten dengan sidik berbeda
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                idempotency_key_konflik:
                  summary: Kunci sama, isi berbeda
                  value:
                    kode: idempotency_key_konflik
                    status: 422
                    title: Konflik idempotency key
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#idempotency_key_konflik
                metadata_tidak_valid:
                  summary: Kunci metadata tidak ada di kontrak endpoint
                  value:
                    errors:
                    - field: status_penerima_manfaat
                      kode: field_tak_dikenal
                    kode: metadata_tidak_valid
                    status: 422
                    title: Metadata tidak valid
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#metadata_tidak_valid
                validasi_gagal:
                  summary: Field input tak dikenal
                  value:
                    errors:
                    - field: TRESHOLD
                      kode: field_tak_dikenal
                    - field: NAMA_LGKAP
                      kode: field_tak_dikenal
                    jumlah_nama_tidak_cocok: 1
                    kode: validasi_gagal
                    status: 422
                    title: Validasi gagal
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#validasi_gagal
        '429':
          description: Kuota periode habis atau limiter penolakan aktif; dengan Retry-After
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 1
              description: 'Detik bulat (minimal 1) hingga percobaan berikutnya. `kuota_habis` mengikuti jendela kuota: sisa waktu sampai ember tertua keluar dari jendela (`bergulir_24j`) atau sampai `reset_kuota` berikutnya (`kalender`); `porsi_sync_habis` dan `penolakan_berlebih` mengikuti token limiter berikutnya'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                kuota_habis:
                  summary: Kuota periode upstream pool habis
                  value:
                    kode: kuota_habis
                    status: 429
                    title: Kuota habis
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#kuota_habis
                penolakan_berlebih:
                  summary: Limiter penolakan client aktif; body hanya empat field
                  value:
                    kode: penolakan_berlebih
                    status: 429
                    title: Penolakan berlebih
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#penolakan_berlebih
        '503':
          description: 'Pool/provider nonaktif (objek_nonaktif, tanpa Retry-After) atau Redis fail-closed (layanan_tidak_tersedia, Retry-After: 5)'
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 1
              description: Hanya ada pada layanan_tidak_tersedia, selalu 5 detik; tidak ada pada objek_nonaktif
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                layanan_tidak_tersedia:
                  summary: Redis tidak siap (fail-closed)
                  value:
                    kode: layanan_tidak_tersedia
                    status: 503
                    title: Layanan tidak tersedia
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#layanan_tidak_tersedia
                objek_nonaktif:
                  summary: Upstream pool atau provider dinonaktifkan
                  value:
                    jenis_objek: provider
                    kode: objek_nonaktif
                    status: 503
                    title: Objek nonaktif
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#objek_nonaktif
      security:
      - oauth2: []
      - apiKey: []
  /v1/endpoints/{endpoint_id}/kontrak:
    get:
      tags:
      - downstream
      summary: |-
        Kontrak satu endpoint: field input, field metadata, dan pola pemanggilan yang
        diizinkan.
      operationId: getEndpointKontrak
      parameters:
      - name: endpoint_id
        in: path
        description: Endpoint yang ditugaskan kepada client pemanggil
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Kontrak endpoint aktif
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointKontrak'
        '401':
          $ref: '#/components/responses/Problem401Down'
        '404':
          description: Endpoint tidak dikenal atau bukan milik client (tidak dibedakan)
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                tidak_ditemukan:
                  summary: Bukan milik client atau tidak ada
                  value:
                    kode: tidak_ditemukan
                    status: 404
                    title: Tidak ditemukan
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#tidak_ditemukan
        '503':
          $ref: '#/components/responses/Problem503Layanan'
      security:
      - oauth2: []
      - apiKey: []
  /v1/endpoints/{endpoint_id}/sync:
    post:
      tags:
      - downstream
      summary: |-
        Pengiriman sinkron: hasil provider dikembalikan pada respons yang sama.
        `Idempotency-Key` tidak boleh dikirim; bila ada, jawabannya 400
        `idempotency_key_tidak_didukung`.
      operationId: submitSync
      parameters:
      - name: endpoint_id
        in: path
        description: Endpoint sinkron; mode ditentukan oleh path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Amplop input + metadata dengan additionalProperties false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
            example:
              input:
                NAMA_LGKP: Budi Santoso
                NIK: '3201234567890001'
              metadata:
                status_penerima_manfaat: sesuai
        required: true
      responses:
        '200':
          description: Jawaban provider lengkap (status done)
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
              examples:
                done:
                  summary: Semua elemen sesuai
                  value:
                    hasil:
                      NAMA_LGKP:
                        skor: 90
                        status: sesuai
                    request_id: 0b19c3b4-7c5f-4e2f-9b3a-1a2b3c4d5e6f
                    status: done
        '400':
          description: JSON tidak valid/kunci ganda (validasi_gagal) atau Idempotency-Key pada sync (idempotency_key_tidak_didukung)
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                idempotency_key_tidak_didukung:
                  summary: Header Idempotency-Key dikirim ke path sync
                  value:
                    kode: idempotency_key_tidak_didukung
                    status: 400
                    title: Idempotency key tidak didukung
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#idempotency_key_tidak_didukung
                validasi_gagal:
                  summary: Body bukan JSON yang sah
                  value:
                    detail: Body bukan JSON yang sah.
                    kode: validasi_gagal
                    status: 400
                    title: Validasi gagal
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#validasi_gagal
        '401':
          $ref: '#/components/responses/Problem401Down'
        '403':
          description: Endpoint nonaktif (penugasan menentukan akses)
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                objek_nonaktif:
                  summary: Endpoint dinonaktifkan
                  value:
                    jenis_objek: endpoint
                    kode: objek_nonaktif
                    status: 403
                    title: Objek nonaktif
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#objek_nonaktif
        '404':
          $ref: '#/components/responses/Problem404Down'
        '422':
          description: Field input/metadata tidak sesuai aturan; nilai yang ditolak tidak dikembalikan
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                metadata_tidak_valid:
                  summary: Kunci metadata tidak ada di kontrak endpoint
                  value:
                    errors:
                    - field: status_penerima_manfaat
                      kode: field_tak_dikenal
                    kode: metadata_tidak_valid
                    status: 422
                    title: Metadata tidak valid
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#metadata_tidak_valid
                validasi_gagal:
                  summary: Field input tak dikenal (termasuk TRESHOLD, USER_ID, PASSWORD, IP_USER, transactionId)
                  value:
                    errors:
                    - field: TRESHOLD
                      kode: field_tak_dikenal
                    - field: NAMA_LGKAP
                      kode: field_tak_dikenal
                    jumlah_nama_tidak_cocok: 1
                    kode: validasi_gagal
                    status: 422
                    title: Validasi gagal
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#validasi_gagal
        '429':
          description: Kuota periode habis, porsi sync/jam berjalan penuh, atau limiter penolakan aktif; semua dengan Retry-After
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 1
              description: 'Detik bulat (minimal 1) hingga percobaan berikutnya. `kuota_habis` mengikuti jendela kuota: sisa waktu sampai ember tertua keluar dari jendela (`bergulir_24j`) atau sampai `reset_kuota` berikutnya (`kalender`); `porsi_sync_habis` dan `penolakan_berlebih` mengikuti token limiter berikutnya'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                kuota_habis:
                  summary: Kuota periode upstream pool habis
                  value:
                    kode: kuota_habis
                    status: 429
                    title: Kuota habis
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#kuota_habis
                penolakan_berlebih:
                  summary: Limiter penolakan client aktif; body hanya empat field
                  value:
                    kode: penolakan_berlebih
                    status: 429
                    title: Penolakan berlebih
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#penolakan_berlebih
                porsi_sync_habis:
                  summary: Porsi sync atau rate limit jam berjalan penuh (satu kode)
                  value:
                    kode: porsi_sync_habis
                    status: 429
                    title: Porsi sync habis
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#porsi_sync_habis
        '502':
          description: retry_habis atau provider_error_permanen, dengan request_id, tanpa Retry-After
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                provider_error_permanen:
                  summary: Kelas kegagalan tidak diulang (auth/kuota provider/kode tak dipetakan/respons invalid/TLS)
                  value:
                    kode: provider_error_permanen
                    request_id: 0b19c3b4-7c5f-4e2f-9b3a-1a2b3c4d5e6f
                    status: 502
                    title: Kesalahan provider permanen
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#provider_error_permanen
                retry_habis:
                  summary: Jendela retry habis (saat ini hanya ada satu percobaan efektif)
                  value:
                    kode: retry_habis
                    request_id: 0b19c3b4-7c5f-4e2f-9b3a-1a2b3c4d5e6f
                    status: 502
                    title: Retry habis
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#retry_habis
        '503':
          description: 'Pool/provider nonaktif (objek_nonaktif, tanpa Retry-After) atau Redis fail-closed (layanan_tidak_tersedia, Retry-After: 5)'
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 1
              description: Hanya ada pada layanan_tidak_tersedia, selalu 5 detik; tidak ada pada objek_nonaktif
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                layanan_tidak_tersedia:
                  summary: Redis tidak siap (fail-closed)
                  value:
                    kode: layanan_tidak_tersedia
                    status: 503
                    title: Layanan tidak tersedia
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#layanan_tidak_tersedia
                objek_nonaktif:
                  summary: Upstream pool atau provider dinonaktifkan
                  value:
                    jenis_objek: provider
                    kode: objek_nonaktif
                    status: 503
                    title: Objek nonaktif
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#objek_nonaktif
        '504':
          description: Panggilan sync tidak selesai dalam batas waktu
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                timeout_sync:
                  summary: Waktu tunggu provider habis
                  value:
                    kode: timeout_sync
                    request_id: 0b19c3b4-7c5f-4e2f-9b3a-1a2b3c4d5e6f
                    status: 504
                    title: Timeout sync
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#timeout_sync
      security:
      - oauth2: []
      - apiKey: []
  /v1/oauth/token:
    post:
      tags:
      - downstream
      summary: |-
        Menerbitkan access token downstream. Kredensial boleh lewat HTTP Basic atau
        body; body 4xx adalah problem+json dengan field `error` menurut RFC 6749,
        kecuali 429.
      operationId: issueToken
      requestBody:
        description: grant_type=client_credentials; kredensial juga boleh lewat HTTP Basic
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            example:
              client_id: bgn-mpm
              client_secret: <secret>
              grant_type: client_credentials
        required: true
      responses:
        '200':
          description: Token baru; tanpa refresh_token
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                token:
                  summary: Token bearer 900 detik
                  value:
                    access_token: eyJhbGciOiJFUzI1NiJ9.eyJzdWIiOiJjbGllbnQifQ.c2lnbmF0dXJl
                    expires_in: 900
                    token_type: Bearer
        '400':
          description: JSON tidak valid, grant tidak didukung, atau kredensial tidak lengkap
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validasi_gagal:
                  summary: grant tidak didukung
                  value:
                    error: unsupported_grant_type
                    kode: validasi_gagal
                    status: 400
                    title: Validasi gagal
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#validasi_gagal
        '401':
          description: Kredensial salah; penyebab tidak dibedakan
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
            WWW-Authenticate:
              schema:
                type: string
              description: Basic untuk endpoint token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                tidak_terautentikasi:
                  summary: client_id/client_secret salah
                  value:
                    error: invalid_client
                    kode: tidak_terautentikasi
                    status: 401
                    title: Tidak terautentikasi
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#tidak_terautentikasi
        '429':
          description: Limiter GCRA per client_id (60/menit, burst 10) atau per IP (120/menit) habis
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 1
              description: Detik bulat (minimal 1) hingga token throttle berikutnya tersedia
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                token_dibatasi:
                  summary: Limiter token habis; tanpa field error
                  value:
                    kode: token_dibatasi
                    status: 429
                    title: Token dibatasi
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#token_dibatasi
      security:
      - {}
  /v1/requests/{queue_id}:
    get:
      tags:
      - downstream
      summary: |-
        Memeriksa status sebuah permintaan. Tidak memotong kuota; hasil `done` tetap
        bisa dibaca sedikitnya selama TTL pool downstream sejak `completed_at`.
      operationId: getRequest
      parameters:
      - name: queue_id
        in: path
        description: queue_id dari enqueueAsync
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Status terkini; tidak pernah mundur
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatus'
              examples:
                cancelled:
                  summary: Dibatalkan client; memuat cancel_reason
                  value:
                    cancel_reason: client
                    queue_id: 0b19c3b4-7c5f-4e2f-9b3a-1a2b3c4d5e6f
                    status: cancelled
                done:
                  summary: Request selesai; memuat hasil
                  value:
                    hasil:
                      NAMA_LGKP:
                        skor: 40
                        status: tidak_sesuai
                    queue_id: 0b19c3b4-7c5f-4e2f-9b3a-1a2b3c4d5e6f
                    status: done
                expired:
                  summary: Kedaluwarsa sebelum diproses
                  value:
                    queue_id: 0b19c3b4-7c5f-4e2f-9b3a-1a2b3c4d5e6f
                    status: expired
                failed:
                  summary: Gagal setelah provider menjawab; memuat failure_reason
                  value:
                    failure_reason: respons_tidak_valid
                    queue_id: 0b19c3b4-7c5f-4e2f-9b3a-1a2b3c4d5e6f
                    status: failed
                processing:
                  summary: Sedang dikirim ke provider
                  value:
                    queue_id: 0b19c3b4-7c5f-4e2f-9b3a-1a2b3c4d5e6f
                    status: processing
                queued:
                  summary: Masih menunggu di antrean
                  value:
                    queue_id: 0b19c3b4-7c5f-4e2f-9b3a-1a2b3c4d5e6f
                    status: queued
        '401':
          $ref: '#/components/responses/Problem401Down'
        '404':
          $ref: '#/components/responses/Problem404Down'
        '503':
          $ref: '#/components/responses/Problem503Layanan'
      security:
      - oauth2: []
      - apiKey: []
  /v1/requests/{queue_id}/cancel:
    post:
      tags:
      - downstream
      summary: |-
        Membatalkan permintaan yang masih `queued`. Permintaan berstatus `processing`
        atau status akhir dijawab 409 `tidak_bisa_dibatalkan` dengan status terkini di
        body.
      operationId: cancelRequest
      parameters:
      - name: queue_id
        in: path
        description: queue_id dari enqueueAsync
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Request dibatalkan
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatus'
              examples:
                cancelled:
                  summary: Dibatalkan sebelum diproses
                  value:
                    cancel_reason: dibatalkan_client
                    queue_id: 0b19c3b4-7c5f-4e2f-9b3a-1a2b3c4d5e6f
                    status: cancelled
        '401':
          $ref: '#/components/responses/Problem401Down'
        '404':
          $ref: '#/components/responses/Problem404Down'
        '409':
          description: Request sedang `processing` atau sudah terminal (`done`/`failed`/`expired`/`cancelled`); body memuat status API saat ini
          headers:
            Cache-Control:
              schema:
                type: string
              description: Selalu `no-store`; respons tidak boleh disimpan cache
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                tidak_bisa_dibatalkan:
                  summary: Status processing atau sudah done/failed/expired/cancelled
                  value:
                    kode: tidak_bisa_dibatalkan
                    status: 409
                    status_api: done
                    title: Tidak bisa dibatalkan
                    type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#tidak_bisa_dibatalkan
        '503':
          $ref: '#/components/responses/Problem503Layanan'
      security:
      - oauth2: []
      - apiKey: []
webhooks:
  requestTerminal:
    post:
      tags:
      - downstream
      summary: |-
        Handler tujuan webhook yang didaftarkan klien.
        Body memakai bentuk yang sama dengan `RequestStatus`, jadi `status`, `hasil`,
        `failure_reason`, dan `cancel_reason` dibaca dengan cara yang sama.
      operationId: requestTerminal
      parameters:
      - name: webhook-id
        in: header
        description: request_id (= queue_id); tetap sama saat retry di F1
        required: true
        schema:
          type: string
        example: 0b19c3b4-7c5f-4e2f-9b3a-1a2b3c4d5e6f
      - name: webhook-timestamp
        in: header
        description: Detik Unix; client menolak selisih > 5 menit
        required: true
        schema:
          type: string
        example: '1762387200'
      - name: webhook-signature
        in: header
        description: v1,<base64(HMAC-SHA256(kunci, "{webhook-id}.{webhook-timestamp}.{body}"))>; kunci = byte hasil decode secret whsec_ (Standard Webhooks)
        required: true
        schema:
          type: string
        example: v1,K5x1s0Y2b3Q4c5D6e7F8g9H0i1J2k3L4m5N6o7P8q9R=
      - name: poolrouter-secret-versi
        in: header
        description: secret_versi yang dipakai; informatif, tidak ikut ditandatangani
        required: true
        schema:
          type: integer
          format: int64
        example: 3
      requestBody:
        description: Status terminal. Untuk `done` memuat `hasil` (bentuk sama dengan polling); tanpa data input dan tanpa NIK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestStatus'
            examples:
              cancelled:
                summary: Dibatalkan client; memuat cancel_reason
                value:
                  cancel_reason: client
                  queue_id: 0b19c3b4-7c5f-4e2f-9b3a-1a2b3c4d5e6f
                  status: cancelled
              done:
                summary: Request selesai; memuat hasil
                value:
                  hasil:
                    NAMA_LGKP:
                      skor: 90
                      status: sesuai
                  queue_id: 0b19c3b4-7c5f-4e2f-9b3a-1a2b3c4d5e6f
                  status: done
        required: true
      responses:
        '200':
          description: 2xx apa pun dari client berarti terkirim; selain itu gagal dan tidak diulang
          headers:
            Cache-Control:
              schema:
                type: string
              description: Respons client; contoh no-store
      security:
      - {}
components:
  schemas:
    ApiStatus:
      type: string
      description: |-
        Status permintaan yang tampil di polling dan webhook. Tidak pernah mundur ke
        status sebelumnya.
      enum:
      - queued
      - processing
      - done
      - failed
      - expired
      - cancelled
    CancelReason:
      type: string
      description: |-
        `cancel_reason` sebuah permintaan berstatus `cancelled`. Satu nilai untuk tiap
        jenis objek; kedua jenis pool memakai `pool_nonaktif`.
      enum:
      - dibatalkan_client
      - client_nonaktif
      - kredensial_nonaktif
      - endpoint_nonaktif
      - pool_nonaktif
      - provider_nonaktif
    EndpointKontrak:
      type: object
      description: |-
        Respons `getEndpointKontrak`. Path yang menentukan sinkron atau asinkron, jadi
        tidak ada field mode yang dikirim.
      required:
      - endpoint_id
      - field_input
      - field_metadata
      - endpoint_config_version
      properties:
        endpoint_config_version:
          type: integer
          format: int64
          example: 1
        endpoint_id:
          type: string
          format: uuid
        field_input:
          type: array
          items:
            $ref: '#/components/schemas/FieldInput'
        field_metadata:
          type: array
          items:
            $ref: '#/components/schemas/FieldMetadata'
      additionalProperties: false
    EnqueueResponse:
      type: object
      description: |-
        202: permintaan asinkron baru. 200 dengan bentuk yang sama: pengulangan
        permintaan dengan `Idempotency-Key` dan sidik yang identik, tanpa permintaan
        baru.
      required:
      - queue_id
      - status
      properties:
        queue_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ApiStatus'
          description: '`queued` pada 202; status terkini pada 200 hasil pengulangan.'
      additionalProperties: false
    FailureReason:
      type: string
      description: |-
        `failure_reason` sebuah permintaan berstatus `failed`. Daftar nilai tertutup
        dan tampil ke klien; `kode` pada body 502/504 sinkron sama dengan nilai ini.
      enum:
      - retry_habis
      - provider_error_permanen
      - timeout_sync
      - objek_nonaktif
    FieldInput:
      type: object
      description: Satu field input pada kontrak endpoint.
      required:
      - nama
      - tipe
      - wajib
      properties:
        nama:
          type: string
        tipe:
          type: string
          description: Tipe logis field, misalnya `string` atau `number`.
        wajib:
          type: boolean
      additionalProperties: false
    FieldMetadata:
      type: object
      description: Satu field metadata pada kontrak endpoint.
      required:
      - nama_field
      - tipe
      - wajib
      - deskripsi
      - versi
      properties:
        deskripsi:
          type: string
        nama_field:
          type: string
        nilai_diizinkan:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Daftar nilai tertutup bila field dibatasi.
        tipe:
          type: string
        versi:
          type: integer
          format: int64
          description: Versi kontrak field metadata ini.
          example: 1
        wajib:
          type: boolean
      additionalProperties: false
    HasilElemen:
      type: object
      description: Hasil untuk satu elemen yang diperiksa.
      required:
      - status
      properties:
        skor:
          type:
          - integer
          - 'null'
          format: int64
          description: 0..=100, atau `null` bila provider tidak memberi skor.
          maximum: 100
          minimum: 0
        status:
          $ref: '#/components/schemas/StatusHasil'
      additionalProperties: false
    JenisObjek:
      type: string
      description: |-
        Jenis objek yang bisa dinonaktifkan. Dikirim di `jenis_objek` pada 403/503
        `objek_nonaktif`.
      enum:
      - endpoint
      - downstream_pool
      - upstream_pool
      - provider
    JumlahNamaTidakCocok:
      type: integer
      format: int32
      description: |-
        Count of failing names that are withheld instead of echoed (D6). A count of
        zero is never emitted: the field is absent when no name was withheld.
      minimum: 1
    Problem:
      type: object
      description: |-
        Body problem RFC 9457 untuk API downstream. `detail` tidak pernah memuat nilai
        input, NIK, atau secret. Nama field memakai bahasa Indonesia, kecuali anggota
        tetap yang ditetapkan RFC.

        Body ini juga dipakai sebagai dasar body admin: keduanya membawa `type`,
        `title`, `status`, `kode`, `detail`, dan `errors`.
      required:
      - type
      - title
      - status
      - kode
      properties:
        detail:
          type:
          - string
          - 'null'
          description: Penjelasan untuk manusia tanpa nilai sensitif; tidak ada bila tidak perlu.
        error:
          type:
          - string
          - 'null'
          description: |-
            Kode `error` menurut RFC 6749 untuk token endpoint. Tidak pernah dikirim
            bersama 429.
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ValidasiErrorDown'
          description: |-
            Field yang gagal validasi; hanya pada body 422 `validasi_gagal` dan
            `metadata_tidak_valid`. Isinya nama field seperti yang dikirim, tidak pernah
            nilainya.
        jenis_objek:
          oneOf:
          - $ref: '#/components/schemas/JenisObjek'
            description: Jenis objek yang nonaktif; hanya pada `objek_nonaktif`.
          - type: 'null'
        jumlah_nama_tidak_cocok:
          oneOf:
          - $ref: '#/components/schemas/JumlahNamaTidakCocok'
            description: |-
              Jumlah nama yang gagal validasi karena tidak cocok dengan
              `^[A-Za-z0-9_]{1,64}$`, sehingga hanya dihitung dan tidak dikembalikan. Field
              ini ada hanya bila sedikitnya satu nama seperti itu ditolak.
          - type: 'null'
        kode:
          $ref: '#/components/schemas/ProblemKodeDown'
        request_id:
          type:
          - string
          - 'null'
          format: uuid
          description: '`queue_id` permintaan yang mengalami kegagalan (body 502/504).'
        status:
          type: integer
          format: int32
          description: HTTP status, 400..=599.
          maximum: 599
          minimum: 400
        status_api:
          oneOf:
          - $ref: '#/components/schemas/ApiStatus'
            description: Status API terkini; hanya pada 409 `tidak_bisa_dibatalkan`.
          - type: 'null'
        title:
          type: string
        type:
          type: string
          description: Stable anchor `https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#<kode>`.
    ProblemKodeDown:
      type: string
      description: |-
        Kode untuk klien downstream. Daftar kode bersifat tertutup: klien tidak boleh
        menganggap kode lain mungkin muncul, dan kode baru hanya dikirim bersama versi
        API baru.
      enum:
      - tidak_terautentikasi
      - token_dibatasi
      - validasi_gagal
      - metadata_tidak_valid
      - idempotency_key_tidak_didukung
      - idempotency_key_konflik
      - kuota_habis
      - porsi_sync_habis
      - penolakan_berlebih
      - objek_nonaktif
      - tidak_bisa_dibatalkan
      - layanan_tidak_tersedia
      - retry_habis
      - provider_error_permanen
      - timeout_sync
      - tidak_ditemukan
    RequestStatus:
      type: object
      description: |-
        Respons polling dan body webhook. Status tidak pernah mundur; `hasil` hanya
        saat `done`, `failure_reason` hanya saat `failed`, `cancel_reason` hanya saat
        `cancelled`.
      required:
      - queue_id
      - status
      properties:
        cancel_reason:
          oneOf:
          - $ref: '#/components/schemas/CancelReason'
          - type: 'null'
        failure_reason:
          oneOf:
          - $ref: '#/components/schemas/FailureReason'
          - type: 'null'
        hasil:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/HasilElemen'
          propertyNames:
            type: string
        queue_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ApiStatus'
      additionalProperties: false
    StatusHasil:
      type: string
      description: Status per elemen pada `hasil`.
      enum:
      - sesuai
      - tidak_sesuai
    SubmitRequest:
      type: object
      description: |-
        Envelope untuk kedua jalur pengiriman; `additionalProperties: false` di
        tingkat envelope. Kunci `metadata` yang tidak dikenal ditolak 422.
      required:
      - input
      - metadata
      properties:
        input:
          type: object
          description: |-
            Field input milik provider; field yang tidak dikenal (termasuk `TRESHOLD`,
            `USER_ID`, `PASSWORD`, `IP_USER`, `transactionId`) ditolak 422 tanpa
            mengembalikan nilainya.
        metadata:
          type: object
          description: Metadata sesuai kontrak endpoint; kunci yang tidak dikenal ditolak 422.
      additionalProperties: false
    SyncResult:
      type: object
      description: 'Respons sinkron: jawaban provider sudah lengkap. `Cache-Control: no-store`.'
      required:
      - request_id
      - status
      - hasil
      properties:
        hasil:
          type: object
          description: Hanya elemen yang dikirim klien, dengan nama elemen sebagai kunci.
          additionalProperties:
            $ref: '#/components/schemas/HasilElemen'
          propertyNames:
            type: string
        request_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ApiStatus'
          description: Selalu `done` pada 200.
      additionalProperties: false
    TipeToken:
      type: string
      description: Nilai `token_type` tertutup; satu-satunya anggota adalah `Bearer`.
      enum:
      - Bearer
    TokenRequest:
      type: object
      description: |-
        Body `application/x-www-form-urlencoded`. Kredensial boleh dikirim lewat
        HTTP Basic; tidak ada nilainya yang dikembalikan pada respons.
      required:
      - grant_type
      properties:
        client_id:
          type:
          - string
          - 'null'
          description: Alternative to HTTP Basic; secret must not appear in URLs.
          example: bgn-mpm-prod
        client_secret:
          type:
          - string
          - 'null'
        grant_type:
          type: string
          description: Nilai tetap `client_credentials`.
      additionalProperties: false
    TokenResponse:
      type: object
      description: |-
        Token Bearer. Tidak ada `refresh_token`; klien memanggil `issueToken` lagi
        setelah kedaluwarsa. Respons membawa `Cache-Control: no-store`.
      required:
      - access_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
          description: |-
            JWT mentah tanpa prefiks `Bearer`. Kirim sebagai
            `Authorization: <token_type> <access_token>`.
        expires_in:
          type: integer
          format: int64
          description: Masa berlaku dalam detik; selalu 900.
          example: 900
        token_type:
          $ref: '#/components/schemas/TipeToken'
          description: Selalu `Bearer`; prefiks ini ada di sini, tidak pernah di `access_token`.
      additionalProperties: false
    ValidasiErrorDown:
      type: object
      description: |-
        Satu field input yang gagal validasi pada API downstream. `kode` adalah kode
        validasi per field; `batas` hanya membawa parameter angka dari aturan yang
        dilanggar (tidak pernah nilai yang ditolak). Tidak ada `posisi`: error
        template hanya ada di API admin.
      required:
      - field
      - kode
      properties:
        batas:
          type: number
          format: double
          description: |-
            Numeric rule parameter of the violated rule, if any. Optional: absent
            when the rule has no numeric parameter (for example `wajib` or an
            unknown rule). When present the value is always a number, never `null`.
        field:
          type: string
          description: |-
            Nama field yang ditolak, persis seperti dikirim (`TRESHOLD`, `NAMA_LGKAP`,
            atau kunci metadata). Nama yang tidak cocok dengan `^[A-Za-z0-9_]{1,64}$`
            tidak pernah dikembalikan; nama seperti itu hanya dihitung di
            `jumlah_nama_tidak_cocok`.
        kode:
          type: string
  responses:
    Problem400Down:
      description: Body bukan JSON yang sah
      headers:
        Cache-Control:
          schema:
            type: string
          description: Selalu `no-store`; respons tidak boleh disimpan cache
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validasi_gagal:
              summary: JSON tidak dapat diurai
              value:
                kode: validasi_gagal
                status: 400
                title: Validasi gagal
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#validasi_gagal
    Problem401Down:
      description: Token atau API key tidak valid atau kedaluwarsa; tidak disimpan
      headers:
        Cache-Control:
          schema:
            type: string
          description: Selalu `no-store`; respons tidak boleh disimpan cache
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer untuk endpoint resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tidak_terautentikasi:
              summary: Token kedaluwarsa atau salah
              value:
                kode: tidak_terautentikasi
                status: 401
                title: Tidak terautentikasi
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#tidak_terautentikasi
    Problem403ObjekNonaktif:
      description: Endpoint nonaktif
      headers:
        Cache-Control:
          schema:
            type: string
          description: Selalu `no-store`; respons tidak boleh disimpan cache
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            objek_nonaktif:
              summary: Endpoint dinonaktifkan
              value:
                jenis_objek: endpoint
                kode: objek_nonaktif
                status: 403
                title: Objek nonaktif
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#objek_nonaktif
    Problem404Down:
      description: Tidak ditemukan atau bukan milik client (tidak dibedakan)
      headers:
        Cache-Control:
          schema:
            type: string
          description: Selalu `no-store`; respons tidak boleh disimpan cache
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tidak_ditemukan:
              summary: queue_id/endpoint_id tidak dikenal
              value:
                kode: tidak_ditemukan
                status: 404
                title: Tidak ditemukan
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#tidak_ditemukan
    Problem503Layanan:
      description: Redis fail-closed atau komponen tidak siap
      headers:
        Cache-Control:
          schema:
            type: string
          description: Selalu `no-store`; respons tidak boleh disimpan cache
        Retry-After:
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Selalu 5 detik
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            layanan_tidak_tersedia:
              summary: Redis tidak siap
              value:
                kode: layanan_tidak_tersedia
                status: 503
                title: Layanan tidak tersedia
                type: https://github.com/faisalcayunda/PoolRouter/blob/main/docs/masalah.md#layanan_tidak_tersedia
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key downstream; token oauth2 adalah pilihan pertama
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /v1/oauth/token
          scopes: {}
tags:
- name: downstream
  description: Endpoint yang dipanggil aplikasi BGN (MPM/LKS/SIPHR)
