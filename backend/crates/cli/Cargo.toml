[package]
name = "poolrouter-cli"
description = "PoolRouter backend-cli (pengguna, peran, seed admin; ADR-0003 section 3.6c) dan migrate (penerap migrasi skema)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "backend-cli"
path = "src/main.rs"

# Pustaka dibuka agar uji integrasi di `tests/` memanggil entrypoint yang sama dengan binary,
# dengan pembaca password dan koneksi basis data sebagai parameter (seam T8 spec f0-admin-api).
# Role owner hanya untuk biner ini (ADR-0001 section 7.2); backend-cli tidak pernah memegangnya.
[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[lib]
name = "poolrouter_cli"
path = "src/lib.rs"

[dependencies]
poolrouter-core = { workspace = true }
chrono = { workspace = true }
secrecy = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
