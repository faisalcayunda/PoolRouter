[package]
name = "poolrouter-cli"
description = "PoolRouter backend-cli: pengguna, peran, dan seed admin (ADR-0003 section 3.6c)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "backend-cli"
path = "src/main.rs"

# Pustaka dibuka agar uji integrasi di `tests/` memanggil entrypoint yang sama dengan binary,
# dengan pembaca password dan koneksi basis data sebagai parameter (seam T8 spec f0-admin-api).
[lib]
name = "poolrouter_cli"
path = "src/lib.rs"

[dependencies]
poolrouter-core = { workspace = true }
chrono = { workspace = true }
secrecy = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
