[package]
name = "poolrouter-adapter-provider"
description = "Provider adapter: request template rendering, response reading, error_class mapping (ADR-0002, ADR-0004 section 4.2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
poolrouter-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
rustls = { workspace = true }
rustls-native-certs = "0.8"
x509-parser = "0.17"
sha2 = "=0.10.9"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
rcgen = "0.13"
tokio-rustls = "0.26"
sqlx = { workspace = true, features = ["postgres", "runtime-tokio"] }
uuid = { workspace = true, features = ["v4"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
