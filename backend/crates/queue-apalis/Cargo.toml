[package]
name = "poolrouter-queue-apalis"
description = "Queue adapter: apalis-amqp consume, lapin publish (ADR-0001 section 6, ADR-0004 section 4.3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
poolrouter-core = { workspace = true }
apalis = { workspace = true }
apalis-amqp = { workspace = true }
apalis-core = { workspace = true }
futures = { workspace = true }
lapin = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# `tokio::sync` dan HTTP mentah ke management API untuk uji kontrak (fitur saja, tanpa crate baru).
tokio = { workspace = true, features = ["sync", "io-util", "net"] }
