[package]
name = "poolrouter-worker"
description = "PoolRouter worker process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "worker"
path = "src/main.rs"

# Pustaka dibuka agar uji integrasi di `tests/` memanggil handler langsung
# terhadap PostgreSQL dan Redis sungguhan (seam CW10, ARC-71).
[lib]
name = "poolrouter_worker"
path = "src/lib.rs"

[dependencies]
poolrouter-core = { workspace = true }
poolrouter-adapter-provider = { path = "../adapter-provider" }
poolrouter-queue-apalis = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
redis = { workspace = true }
secrecy = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
# AC-16: uji tangkap `tracing` (secret dan NIK tidak muncul di log aplikasi).
tracing-subscriber = { workspace = true }
# ARC-240: server HTTPS uji dengan sertifikat sintetis (galat sertifikat menjadi `tls`).
rcgen = "0.13"
tokio = { workspace = true, features = ["io-util"] }
rustls = { workspace = true }
tokio-rustls = "0.26"
# ARC-239: pin SPKI uji = SHA-256 SPKI sertifikat sintetis, base64 standar.
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
