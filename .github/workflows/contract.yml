# Kontrak API (ADR-0003 section 4.2, SHAA-194). `openapi-check` sejak SHAA-192
# juga menjalankan `oasdiff breaking` terhadap baseline eksplisit OASDIFF_BASE
# (SHAA-278 D1-D6, SHAA-279; oasdiff ter-pin, backend/Makefile): downstream-api
# gagal jika breaking, admin-api hanya ::warning::. `gen-api-check` dan `tsc`
# belum dipasang: menunggu sub-issue frontend (ADR-0004 section 4.1).
# Trigger pull_request belum ada. Kalau ditambahkan nanti, baseline-nya
# `github.event.pull_request.base.sha`.
name: contract

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/contract.yml"
  workflow_dispatch:
    inputs:
      oasdiff_base:
        description: "Git rev baseline untuk oasdiff breaking"
        required: false
        default: "HEAD~1"

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  openapi-check:
    # Ambang: gagal jika `make openapi-check` exit non-zero.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: docker.io/library/rust:1.99.1-bookworm@sha256:9181b56c2a21ab1d5e73cffe04fc762426d30aa7fac3c91141dd033f49a7fc8b
    env:
      RUNNER: native
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # commit baseline (OASDIFF_BASE) harus tersedia

      # DIAGNOSTIK SEMENTARA (SHAA-275): dihapus setelah akar exit 2 terbukti.
      # Tanpa env/printenv/set -x; hanya ekor ~20 baris output make.
      - name: diagnostik ref dan arsitektur (sementara)
        shell: bash
        run: |
          uname -m
          git branch -a || echo "git branch rc=$?"
          git ls-remote --heads origin main || echo "ls-remote rc=$?"
          git status --porcelain -- openapi; echo "git-status-openapi rc=$?"

      - name: openapi-check
        shell: bash
        env:
          OASDIFF_BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.oasdiff_base || github.event.before }}
          OASDIFF_BASE_SOURCE: ${{ github.event_name == 'workflow_dispatch' && 'dispatch' || 'push.before' }}
        run: |
          set -o pipefail
          rc=0
          make -C backend openapi-check 2>&1 | tee openapi-check.log || rc=$?
          if [ "$rc" -ne 0 ]; then
            tail -n 20 openapi-check.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}' > openapi-check.tail
            echo "::error title=openapi-check::rc=${rc}%0A$(cat openapi-check.tail)"
          fi
          exit "$rc"
