# Kontrak API (ADR-0003 section 4.2, SHAA-194). `openapi-check` sejak SHAA-192
# juga menjalankan `oasdiff breaking` terhadap baseline eksplisit OASDIFF_BASE
# (SHAA-278 D1-D6, SHAA-279; oasdiff ter-pin, backend/Makefile): downstream-api
# gagal jika breaking, admin-api hanya ::warning::. `gen-api-check` dan `tsc`
# berjalan di frontend.yml (SHAA-281), yang juga terpicu oleh perubahan admin-api.yaml.
# Trigger pull_request (ARC-212): baseline oasdiff-nya `github.event.pull_request.base.sha`.
name: contract

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/contract.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/contract.yml"
  workflow_dispatch:
    inputs:
      oasdiff_base:
        description: "Git rev baseline untuk oasdiff breaking"
        required: false
        default: "HEAD~1"

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  # PR: run lama untuk PR yang sama dibatalkan; push ke main tidak pernah dibatalkan.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  openapi-check:
    # Ambang: gagal jika `make openapi-check` exit non-zero.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: docker.io/library/rust:1.99.1-bookworm@sha256:9181b56c2a21ab1d5e73cffe04fc762426d30aa7fac3c91141dd033f49a7fc8b
    env:
      RUNNER: native
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # commit baseline (OASDIFF_BASE) harus tersedia

      - name: openapi-check
        shell: bash
        env:
          OASDIFF_BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.oasdiff_base || github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          OASDIFF_BASE_SOURCE: ${{ github.event_name == 'workflow_dispatch' && 'dispatch' || github.event_name == 'pull_request' && 'pull_request.base.sha' || 'push.before' }}
        run: |
          set -o pipefail
          git config --global --add safe.directory "$(pwd)"
          rc=0
          make -C backend openapi-check 2>&1 | tee openapi-check.log || rc=$?
          if [ "$rc" -ne 0 ]; then
            tail -n 20 openapi-check.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}' > openapi-check.tail
            echo "::error title=openapi-check::rc=${rc}%0A$(cat openapi-check.tail)"
          fi
          exit "$rc"
