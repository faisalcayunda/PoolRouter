# Gate frontend (SHAA-194). Hanya berjalan jika ada perubahan di `frontend/`. Selama `frontend/` belum ada,
# job di-skip dengan benar: langkah pertama keluar dengan sukses jika `frontend/Makefile` belum ada.
# Ambang `pnpm audit --prod`: gagal pada temuan severity high atau critical (`--audit-level high`).
name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/openapi/admin-api.yaml"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Node sama dengan frontend/.nvmrc (24.22.2) dan NODE_IMAGE di frontend/Makefile. Digest sama dengan Makefile.
    container:
      image: docker.io/library/node:24.22.2-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
    # Runner GitHub tidak memakai Podman: target memakai Node di container, tanpa check-label (SHAA-197).
    env:
      FRONTEND_RUNNER: local
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Lewati jika frontend belum ada
        id: guard
        run: |
          if [ ! -f frontend/Makefile ]; then
            echo "frontend/Makefile belum ada: job di-skip."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Image slim tidak memuat make (ARC-27). Image dan digest tetap sama dengan frontend/Makefile.
      - name: Pasang make
        if: steps.guard.outputs.skip != 'true'
        run: apt-get update && apt-get install -y --no-install-recommends make

      - name: Gate frontend
        if: steps.guard.outputs.skip != 'true'
        run: make -C frontend setup test lint

      # Drift tipe (SHAA-281): generate ulang dari backend/openapi/admin-api.yaml lalu diff; gagal bila
      # schema.gen.ts tertinggal. `tsc --noEmit` sudah ada di `make lint` pada langkah di atas.
      - name: gen-api-check (drift tipe)
        if: steps.guard.outputs.skip != 'true'
        run: make -C frontend gen-api-check

      - name: "pnpm audit --prod (ambang: high)"
        if: steps.guard.outputs.skip != 'true'
        run: cd frontend && npx --yes pnpm@9 audit --prod --audit-level high
