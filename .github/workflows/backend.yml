# Gate backend (ADR-0003 section 5, SHAA-194). Menjalankan gate backend lengkap
# (`setup`, `test`, `lint`) sesuai docs/runbook/docker-lane.md. Tidak ada secret yang dipakai.
# Tidak menyentuh stack Compose (milik SHAA-207). Action dan image di-pin dengan tag dan digest.
#
# Job sengaja TIDAK memakai `container:`: uji container (`db-test`, `uji-pg`, `uji-lua`,
# `uji-redis`) butuh docker di host, dan image Rust tidak membawa docker. Runner host
# menjalankan lane Docker (ARC-373): cargo tetap di dalam image Rust yang di-pin
# (`RUNNER=docker` di backend/Makefile), uji container memakai docker runner.
# Gate dipanggil langsung di `backend/`, bukan dari akar, supaya frontend tidak ikut
# (frontend sudah dicakup frontend.yml, ARC-27).
name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    # Ambang gagal: setiap langkah `make` di bawah harus exit 0. `cargo fmt --check`, clippy `-D warnings`,
    # dan `cargo deny check` masing-masing gagal pada temuan apa pun.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Toolchain tetap image yang di-pin (ADR-0004 section 2), dipakai lewat lane Docker backend/Makefile.
      RUNNER: docker
      # Label wajib setiap container gate (ARC-222); juga sumber ARC_ISSUE untuk uji container.
      CONTAINER_LABEL: arctiva.issue=ARC-29
      ARC_ISSUE: ARC-29
      JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Siapkan direktori cache lane Docker
        # backend/Makefile (RUNNER=docker) memakai cache bersama di /data dan target di /var/tmp.
        run: sudo install -d -o "$USER" -g "$(id -g)" /data/workspace/arctiva-build /var/tmp/arctiva-build

      - name: Gate backend (setup, test, lint)
        run: make -C backend setup test lint

      - name: Bersihkan container berlabel issue (selalu)
        if: always()
        run: bash scripts/docker-lane.sh cleanup ARC-29
