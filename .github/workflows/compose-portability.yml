# V4 (ADR-0001 Addendum A §8): compose-portability.
# Menjalankan V1 (compose-lint) dan V3 (harness DinD) di runner GitHub. Runner ini memakai
# Docker Engine untuk V1; V3 tetap memakai harness `deploy/compose/test/dind.sh` yang
# berjalan lewat Podman rootful di runner, dengan Docker Engine sementara di dalam container.
# Tidak ada secret repo yang dipakai. Secret uji dibuat acak saat run di direktori sementara
# runner (mode 0700 dan file 0444), tidak disimpan dan tidak dicetak.
name: compose-portability

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "**/Containerfile"
      - "**/.dockerignore"
      - "perf/mock-dukcapil/**"
      - ".github/workflows/compose-portability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-portability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compose-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Label container wajib arctiva.issue=ARC-<n>; dind.sh menolak format lain.
      ARC_ISSUE: ARC-2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Catat versi engine dan file (V5)
        run: |
          docker version --format 'docker server={{.Server.Version}}'
          docker compose version
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman >/dev/null
          podman --version
          sha256sum deploy/compose/compose*.yaml deploy/compose/test/images.env

      - name: V1 compose-lint (Docker Engine)
        run: make compose-lint CONTAINER_ENGINE=docker

      - name: Siapkan secret uji dan env sementara (di luar repo)
        run: |
          set -eu
          dir="$RUNNER_TEMP/poolrouter-secrets"
          mkdir -p "$dir"
          # 0755 agar UID container non-root (postgres, rabbitmq, redis) bisa menelusuri direktori
          # ini saat dibind-mount lewat Podman rootful. Isi tetap acak per run, file 0444,
          # dan induknya ($RUNNER_TEMP) hanya milik user runner.
          chmod 0755 "$dir"
          # Daftar harus sama dengan blok `secrets:` di deploy/compose/compose.yaml.
          for f in db_password redis_password rabbitmq_password poolrouter_owner \
                   pr_api pr_admin_api pr_controller pr_webhook pr_worker \
                   pr_job_balikan pr_job_arsip pr_restore pr_blend \
                   poolrouter_kek poolrouter_jwt_signing_key poolrouter_nik_hmac_key \
                   poolrouter_idempotency_hmac_key; do
            # Nilai acak per run, hanya untuk smoke test. Tidak dicetak.
            openssl rand -hex 24 > "$dir/$f"
            chmod 0444 "$dir/$f"
            # Sensor nilai di log job, jika kebetulan tercetak oleh tool di bawahnya.
            echo "::add-mask::$(cat "$dir/$f")"
          done
          env_file="$RUNNER_TEMP/poolrouter.env"
          sed "s|^POOLROUTER_SECRETS_DIR=.*|POOLROUTER_SECRETS_DIR=$dir|" \
            deploy/compose/env/staging.env.example > "$env_file"
          chmod 0444 "$env_file"
          echo "ENV_FILE=$env_file" >> "$GITHUB_ENV"

      - name: V3 harness DinD (compose-test-dind)
        run: |
          # Output disimpan ke file di $RUNNER_TEMP (milik user runner) supaya step ringkasan
          # di bawah bisa membacanya. Exit code make dipertahankan agar step ini tetap merah.
          out="$RUNNER_TEMP/v3-harness.out"
          rc=0
          sudo env "PATH=$PATH" make compose-test-dind \
            CONTAINER_ENGINE=podman ARC_ISSUE="$ARC_ISSUE" ENV_FILE="$ENV_FILE" \
            > "$out" 2>&1 || rc=$?
          cat "$out"
          exit "$rc"

      - name: Cetak log harness saat V3 gagal
        if: failure()
        run: |
          # Log ditulis root oleh sudo. Dibaca di sini, sebelum step pembersihan.
          for f in deploy/compose/test/logs/*.log; do
            echo "--- $f"
            sudo cat "$f" || true
          done

      - name: Ringkas kegagalan V3 ke annotation dan ringkasan (redaksi)
        if: failure()
        run: |
          # Hanya ±60 baris terakhir, dengan nilai secret uji diganti *** dan baris berkata kunci
          # secret dibuang. Hasilnya bisa dibaca publik lewat check-runs/{id}/annotations.
          # Batasan: redaksi hanya mencocokkan nilai literal (dan kata kunci), bukan bentuk
          # turunan (base64, URL-encoded, terpotong). Jangan menambah output yang memuat secret.
          python3 - "$RUNNER_TEMP/v3-harness.out" "$RUNNER_TEMP/poolrouter-secrets" <<'PY'
          import os, re, sys
          src, sdir = sys.argv[1], sys.argv[2]
          try:
              lines = open(src, encoding="utf-8", errors="replace").read().splitlines()
          except OSError:
              lines = ["(output harness tidak tersedia)"]
          secrets = []
          if os.path.isdir(sdir):
              for name in os.listdir(sdir):
                  try:
                      val = open(os.path.join(sdir, name), encoding="utf-8").read().strip()
                  except OSError:
                      continue
                  if len(val) >= 8:
                      secrets.append(val)
          keyword = re.compile(r"PASSWORD|SECRET|TOKEN|PRIVATE|HMAC|KEK|JWT", re.IGNORECASE)
          kept = []
          for line in lines[-60:]:
              if keyword.search(line):
                  kept.append("[baris dengan kata kunci secret dibuang]")
                  continue
              for val in secrets:
                  line = line.replace(val, "***")
              kept.append(line)
          tail = "\n".join(kept)[-6000:]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## V3 harness DinD gagal (±60 baris terakhir, sudah diredaksi)\n\n```text\n")
              f.write(tail + "\n```\n")
          # Escape format workflow command: %, CR, LF.
          esc = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=V3 harness DinD::{esc}")
          PY

      - name: Bersihkan resource berlabel (selalu)
        if: always()
        run: |
          sudo podman rm -f -v --filter "label=arctiva.issue=$ARC_ISSUE" >/dev/null 2>&1 || true
          sudo podman volume prune -f --filter "label=arctiva.issue=$ARC_ISSUE" >/dev/null 2>&1 || true
          sudo podman network prune -f --filter "label=arctiva.issue=$ARC_ISSUE" >/dev/null 2>&1 || true
          left=$(sudo podman ps -a --filter "label=arctiva.issue=$ARC_ISSUE" -q | wc -l | tr -d ' ')
          echo "CLEANUP left_containers=$left"
          rm -rf "$RUNNER_TEMP/poolrouter-secrets" "$RUNNER_TEMP/poolrouter.env"

      - name: Unggah log harness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-portability-logs
          path: deploy/compose/test/logs/
          if-no-files-found: ignore
          retention-days: 14

  # Bukti build image mock Dukcapil (perf/mock-dukcapil) di runner amd64. Tanpa push, tanpa secret.
  # Pin digest per-platform (arm64) akan gagal di sini dengan "image platform does not match".
  mock-dukcapil-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image mock-dukcapil (linux/amd64, tanpa push)
        run: |
          set -eu
          docker build --platform linux/amd64 \
            -f perf/mock-dukcapil/Containerfile \
            -t localhost/poolrouter-mock-dukcapil:ci perf/mock-dukcapil

      - name: Verifikasi arsitektur dan user non-root
        run: |
          set -eu
          arch="$(docker image inspect --format '{{.Architecture}}' localhost/poolrouter-mock-dukcapil:ci)"
          user="$(docker image inspect --format '{{.Config.User}}' localhost/poolrouter-mock-dukcapil:ci)"
          echo "arch=${arch} user=${user}"
          [ "${arch}" = "amd64" ]
          [ "${user}" = "10001:10001" ]

      - name: Bersihkan image (selalu)
        if: always()
        run: docker image rm -f localhost/poolrouter-mock-dukcapil:ci >/dev/null 2>&1 || true
