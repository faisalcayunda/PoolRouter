# Konfigurasi Gitleaks (SHAA-207, keputusan Huan). Memperluas ruleset bawaan; tidak ada aturan yang dimatikan.
# Hanya dua pengecualian sempit, keduanya dinilai sintetis oleh Ridley. Token JWT ditulis utuh karena nilainya
# sudah publik (contoh di dokumentasi OpenAPI dan anotasi Rust); tidak ada kredensial nyata di berkas ini.
# Rujukan: komentar Ridley (17:17 UTC) dan keputusan Huan (17:18 UTC) di SHAA-207, thread 01a1a26b-47a6-7a22-bf13-998b7d30f126.
# Dilarang melebarkan ke backend/** atau ke pola JWT umum.
title = "PoolRouter gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Contoh sintetis yang sudah dinilai: token contoh OpenAPI/Rust, fixture lint, dan test password sintetis"
# 1) Token contoh sintetis di dokumentasi OpenAPI dan anotasi Rust (header ES256 + payload sub=client,
#    signature 12 karakter, bukan token nyata). Allowlist mencocokkan token UTUH sebagai tiga ruas literal
#    (header, payload, signature 12 karakter) yang dipisah titik yang di-escape; tidak ada wildcard, kelas
#    karakter, kuantifier, atau anchor separuh mana pun. Signature satu karakter berbeda saja tetap terdeteksi;
#    bukti N1-N5 ada di komentar SHAA-207. Nilai signature sama dengan contoh publik sintetis di
#    backend/openapi/downstream-api.yaml dan backend/crates/webserver/src/api/downstream.rs, jadi aman ditulis utuh.
regexes = [
  '''^eyJhbGciOiJFUzI1NiJ9\.eyJzdWIiOiJjbGllbnQifQ\.c2lnbmF0dXJl$''',
]
# 2) Fixture pelanggaran lint compose (sengaja salah; berisi digest, bukan kredensial). Satu berkas saja.
# 3) File test login dengan password sintetis (bukan kredensial nyata).
paths = [
  '''^deploy/compose/lint/fixtures/render-bad-prod-mock\.yaml$''',
  '''^frontend/tests/login\.test\.tsx$''',
]
