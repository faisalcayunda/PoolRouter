# nginx utama image frontend (ADR-0003 §3.9). Berjalan sebagai user non-root; semua yang
# ditulis saat runtime ada di /tmp (tmpfs), sehingga root filesystem bisa read-only.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Access log tanpa body, header, dan query string: hanya path (tanpa $args). NIK tidak pernah
  # ada di URL (ADR-0003 §3.6), dan query string tidak dicatat sebagai lapisan kedua.
  log_format poolrouter '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent '
                        '"$http_user_agent" rt=$request_time';
  access_log /dev/stdout poolrouter;

  sendfile on;
  keepalive_timeout 65;

  include /tmp/nginx-conf/*.conf;
}
