# Header wajib ADR-0003 §3.9. Di-include di setiap location, karena add_header di location
# menggantikan add_header tingkat server. CSP disalin dari frontend/vite.csp.ts (CSP_DIRECTIVES,
# isDev=false); tests/nginx-csp.test.ts gagal bila salinan ini berbeda.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'sha256-38RhXrc7EdReTKsOm23ZPOCUgniTUUcjky8QOOrQx6o='; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS hanya di poc dan prod (dirender oleh 15-poolrouter-prepare.sh; kosong di lingkungan lain).
include /tmp/nginx-conf/hsts.inc;
